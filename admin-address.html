<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Địa chỉ — HK COMPUTER Admin</title>
    <link rel="stylesheet" href="./assets/css/admin.css?v=6" />
</head>
<body>
    <div class="admin-layout">
        <aside id="adminSidebar"></aside>

        <div class="admin-main">
            <header id="adminTopbar"></header>

            <main class="admin-content-body">
                <div class="table-toolbar">
                    <div>
                        <h1 style="font-size: var(--text-2xl);">Danh sách Địa chỉ Giao hàng</h1>
                        <p style="font-size: var(--text-xs);">Tra cứu thông tin địa chỉ nhận hàng của khách hàng.</p>
                    </div>
                </div>

                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Người nhận</th>
                                <th>Số điện thoại</th>
                                <th>Địa chỉ</th>
                                <th>Mặc định</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="5" style="text-align: center; padding: 32px;">Đang tải...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div id="paginationBar" style="display: flex; justify-content: center; gap: 8px; margin-top: 20px;"></div>
            </main>
        </div>
    </div>

    <script type="module">
        import { api } from './assets/js/api.js';
        import { auth } from './assets/js/auth.js';
        import { CONFIG } from './assets/js/config.js';
        import { initAdminLayout } from './assets/js/admin-layout.js?v=6';

        async function loadAddresses(page = 0) {
            if (!auth.requireAdmin()) return;
            try {
                const data = await api.get(CONFIG.ENDPOINTS.AUTH.USER_ADDRESS_ADMIN, { page_no: page, page_size: 10, id: 'id', asc: 'asc' });
                const items = data?.content || [];
                const totalPages = data?.totalPages || 1;
                const tbody = document.getElementById('tableBody');

                if (!items.length) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:32px;">Không có dữ liệu.</td></tr>`;
                    return;
                }

                tbody.innerHTML = items.map(a => `
                    <tr>
                        <td class="tabular-nums">#${a.id}</td>
                        <td style="font-weight: var(--font-medium);">${a.username}</td>
                        <td class="tabular-nums">${a.phone}</td>
                        <td>${a.address}</td>
                        <td>${(a.defaultaddress === true || a.defaultaddress === 'true') ? '<span class="badge badge-success">Mặc định</span>' : '<span class="badge">Phụ</span>'}</td>
                    </tr>
                `).join('');

                const pag = document.getElementById('paginationBar');
                pag.innerHTML = totalPages > 1 ? Array.from({ length: totalPages }, (_, i) =>
                    `<button class="btn btn-sm ${i === page ? 'btn-primary' : 'btn-secondary'}" data-page="${i}">${i + 1}</button>`
                ).join('') : '';
                pag.querySelectorAll('button').forEach(b => b.addEventListener('click', () => loadAddresses(Number(b.dataset.page))));
            } catch (err) {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="5" class="text-danger" style="text-align:center; padding:32px;">${err.message}</td></tr>`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => { initAdminLayout({ active: 'addresses', title: 'Sổ địa chỉ Khách hàng' }); loadAddresses(0); });
    </script>
</body>
</html>
