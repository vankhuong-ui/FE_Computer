<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Tài khoản — HK COMPUTER Admin</title>
    <link rel="stylesheet" href="./assets/css/admin.css?v=6" />
</head>
<body>
    <div class="admin-layout">
        <aside id="adminSidebar"></aside>

        <div class="admin-main">
            <header id="adminTopbar"></header>

            <main class="admin-content-body">
                <div class="table-toolbar">
                    <div>
                        <h1 style="font-size: var(--text-2xl);">Danh sách Tài khoản</h1>
                        <p style="font-size: var(--text-xs);">Kiểm soát trạng thái kích hoạt của người dùng trong hệ thống.</p>
                    </div>
                </div>

                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Tên tài khoản</th>
                                <th>Gmail</th>
                                <th>Vai trò</th>
                                <th>Trạng thái</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="6" style="text-align: center; padding: 32px;">Đang tải...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div id="paginationBar" style="display: flex; justify-content: center; gap: 8px; margin-top: 20px;"></div>
            </main>
        </div>
    </div>

    <script type="module">
        import { api } from './assets/js/api.js';
        import { auth } from './assets/js/auth.js';
        import { CONFIG } from './assets/js/config.js';
        import { initAdminLayout } from './assets/js/admin-layout.js?v=6';
        import { toast } from './assets/js/toast.js';

        let currentPage = 0;

        async function loadAccounts(page = 0) {
            if (!auth.requireAdmin()) return;
            currentPage = page;
            try {
                const data = await api.get(CONFIG.ENDPOINTS.AUTH.ADMIN_LIST, { page_no: page, page_size: 10, sortBy: 'id', sortDir: 'asc' });
                const items = data?.content || [];
                const totalPages = data?.totalPages || 1;
                const tbody = document.getElementById('tableBody');

                if (!items.length) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:32px;">Không có dữ liệu.</td></tr>`;
                    return;
                }

                tbody.innerHTML = items.map(acc => `
                    <tr>
                        <td class="tabular-nums">#${acc.id}</td>
                        <td style="font-weight: var(--font-medium);">${acc.accountname || '-'}</td>
                        <td>${acc.gmail}</td>
                        <td><span class="badge badge-info">${acc.role || 'USER'}</span></td>
                        <td>${acc.enabled ? '<span class="badge badge-success">Hoạt động</span>' : '<span class="badge badge-danger">Đã khóa</span>'}</td>
                        <td>
                            <button type="button" class="btn btn-sm ${acc.enabled ? 'btn-outline text-danger' : 'btn-primary'} btn-toggle" data-id="${acc.id}" data-next="${!acc.enabled}">
                                ${acc.enabled ? 'Khóa' : 'Kích hoạt'}
                            </button>
                        </td>
                    </tr>
                `).join('');

                document.querySelectorAll('.btn-toggle').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        try {
                            await api.put(CONFIG.ENDPOINTS.AUTH.ADMIN_ENABLE(btn.dataset.id), btn.dataset.next === 'true');
                            toast.success('Cập nhật trạng thái tài khoản thành công!');
                            loadAccounts(currentPage);
                        } catch (err) {
                            toast.error(err.message);
                        }
                    });
                });

                const pag = document.getElementById('paginationBar');
                pag.innerHTML = totalPages > 1 ? Array.from({ length: totalPages }, (_, i) =>
                    `<button class="btn btn-sm ${i === page ? 'btn-primary' : 'btn-secondary'}" data-page="${i}">${i + 1}</button>`
                ).join('') : '';
                pag.querySelectorAll('button').forEach(b => b.addEventListener('click', () => loadAccounts(Number(b.dataset.page))));
            } catch (err) {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="6" class="text-danger" style="text-align:center; padding:32px;">${err.message}</td></tr>`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => { initAdminLayout({ active: 'accounts', title: 'Quản lý Tài khoản' }); loadAccounts(0); });
    </script>
</body>
</html>
