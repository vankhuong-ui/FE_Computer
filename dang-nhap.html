<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập — HK COMPUTER</title>
    <link rel="stylesheet" href="./assets/css/base.css?v=4" />
    <link rel="stylesheet" href="./assets/css/components.css?v=4" />
    <style>
        .auth-topbar {
            height: 64px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
        }
        .auth-page-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow-subtle);
        }
        .auth-divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: var(--text-xs);
        }
        .auth-divider::before, .auth-divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border); }
        .auth-divider span { padding: 0 12px; }
        .pwd-wrap { position: relative; }
        .pwd-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: var(--text-xs);
            cursor: pointer;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <header class="auth-topbar">
        <div class="container" style="display:flex; align-items:center; justify-content:space-between;">
            <a href="index.html" class="brand-logo">
                <span class="brand-hk">HK</span>
                <span class="brand-computer">COMPUTER</span>
            </a>
            <div style="display:flex; align-items:center; gap:10px;">
                <button type="button" class="theme-toggle-btn" data-theme-toggle aria-label="Chuyển giao diện Sáng/Tối">🌙</button>
                <a href="index.html" class="btn btn-outline btn-sm">← Về cửa hàng</a>
            </div>
        </div>
    </header>

    <main class="auth-page-body">
        <div class="auth-card">
            <div style="margin-bottom: 24px;">
                <h1 style="font-size: var(--text-2xl); margin-bottom: 6px;">Đăng nhập</h1>
                <p style="font-size: var(--text-xs);">Đăng nhập để quản lý đơn hàng, bảo hành điện tử và lịch hẹn sửa chữa tại HK COMPUTER.</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="gmail">Email đăng nhập</label>
                    <input type="email" id="gmail" class="input" placeholder="ban@gmail.com" required autocomplete="email" />
                </div>

                <div class="form-group">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <label class="form-label" for="password">Mật khẩu</label>
                        <a href="#" id="linkForgotPassword" style="font-size: var(--text-xs); color: var(--brand-green); font-weight: 500;">Quên mật khẩu?</a>
                    </div>
                    <div class="pwd-wrap">
                        <input type="password" id="password" class="input" placeholder="Nhập mật khẩu" required autocomplete="current-password" style="padding-right: 52px;" />
                        <button type="button" class="pwd-toggle" id="btnTogglePwd">Hiện</button>
                    </div>
                </div>

                <button type="submit" id="btnLogin" class="btn btn-primary" style="width: 100%; height: 42px; margin-top: 6px;">
                    Đăng nhập
                </button>
            </form>

            <div class="auth-divider"><span>Hoặc tiếp tục với</span></div>

            <button type="button" id="btnGoogleLogin" class="btn btn-secondary" style="width: 100%; height: 42px;">
                <svg width="16" height="16" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.55 10.78l7.98-6.19z" />
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                </svg>
                <span>Đăng nhập bằng Google</span>
            </button>

            <div style="margin-top: 24px; text-align: center; font-size: var(--text-xs); color: var(--text-secondary);">
                Chưa có tài khoản? <a href="dang-ky.html" style="color: var(--brand-green); font-weight: 600;">Đăng ký ngay</a>
            </div>
        </div>
    </main>

    <!-- Forgot Password Modal -->
    <div class="hk-modal-backdrop" id="forgotModal">
        <div class="hk-modal-box" style="max-width: 400px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
                <h3 style="font-size: var(--text-lg);">Khôi phục mật khẩu</h3>
                <button type="button" id="btnCloseForgot" style="background:none; border:none; font-size:20px; cursor:pointer; color:var(--text-secondary);">×</button>
            </div>
            <div id="step1Forgot">
                <p style="font-size: var(--text-xs); margin-bottom: 14px;">Nhập email đã đăng ký để nhận mã OTP 6 số đặt lại mật khẩu.</p>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="forgotEmail" class="input" placeholder="ban@gmail.com" />
                </div>
                <button type="button" id="btnSendOtp" class="btn btn-primary" style="width: 100%;">Gửi mã OTP</button>
            </div>
            <div id="step2Forgot" class="hidden">
                <p style="font-size: var(--text-xs); margin-bottom: 14px;">Mã OTP đã gửi tới <b id="displayTargetEmail"></b>.</p>
                <div class="form-group">
                    <label class="form-label">Mã OTP (6 số)</label>
                    <input type="text" id="resetOtpCode" class="input tabular-nums" placeholder="123456" maxlength="6" />
                </div>
                <div class="form-group">
                    <label class="form-label">Mật khẩu mới</label>
                    <input type="password" id="resetNewPassword" class="input" placeholder="Tối thiểu 6 ký tự" />
                </div>
                <button type="button" id="btnResetPassword" class="btn btn-primary" style="width: 100%;">Đặt lại mật khẩu</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { theme } from './assets/js/theme.js';
        import { auth } from './assets/js/auth.js';
        import { api } from './assets/js/api.js';
        import { CONFIG } from './assets/js/config.js';
        import { toast } from './assets/js/toast.js';

        theme.init();

        if (auth.isAuthenticated()) {
            window.location.href = auth.isAdmin() ? CONFIG.ROUTES.ADMIN_DASHBOARD : CONFIG.ROUTES.HOME;
        }

        const pwdInput = document.getElementById('password');
        const btnTogglePwd = document.getElementById('btnTogglePwd');
        btnTogglePwd.addEventListener('click', () => {
            const isPwd = pwdInput.type === 'password';
            pwdInput.type = isPwd ? 'text' : 'password';
            btnTogglePwd.textContent = isPwd ? 'Ẩn' : 'Hiện';
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const gmail = document.getElementById('gmail').value.trim();
            const password = pwdInput.value;
            const btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.textContent = 'Đang xác thực...';

            try {
                await auth.login(gmail, password);
                toast.success('Đăng nhập thành công!');
                const redirectParam = new URLSearchParams(window.location.search).get('redirect');
                setTimeout(() => {
                    if (redirectParam) window.location.href = decodeURIComponent(redirectParam);
                    else window.location.href = auth.isAdmin() ? CONFIG.ROUTES.ADMIN_DASHBOARD : CONFIG.ROUTES.HOME;
                }, 500);
            } catch (err) {
                toast.error(err.message || 'Email hoặc mật khẩu không chính xác.');
                btn.disabled = false;
                btn.textContent = 'Đăng nhập';
            }
        });

        document.getElementById('btnGoogleLogin').addEventListener('click', () => {
            window.location.href = `${CONFIG.API_BASE_URL}/oauth2/authorization/google`;
        });

        const forgotModal = document.getElementById('forgotModal');
        const step1 = document.getElementById('step1Forgot');
        const step2 = document.getElementById('step2Forgot');
        document.getElementById('linkForgotPassword').addEventListener('click', (e) => {
            e.preventDefault();
            forgotModal.classList.add('active');
        });
        document.getElementById('btnCloseForgot').addEventListener('click', () => {
            forgotModal.classList.remove('active');
            step1.classList.remove('hidden');
            step2.classList.add('hidden');
        });

        document.getElementById('btnSendOtp').addEventListener('click', async () => {
            const email = document.getElementById('forgotEmail').value.trim();
            if (!email) { toast.warning('Vui lòng nhập email.'); return; }
            try {
                await api.post(`${CONFIG.ENDPOINTS.AUTH.SEND_OTP}?gmail=${encodeURIComponent(email)}`);
                toast.success('Đã gửi mã OTP về email.');
                document.getElementById('displayTargetEmail').textContent = email;
                step1.classList.add('hidden');
                step2.classList.remove('hidden');
            } catch (err) { toast.error(err.message); }
        });

        document.getElementById('btnResetPassword').addEventListener('click', async () => {
            const email = document.getElementById('forgotEmail').value.trim();
            const code = document.getElementById('resetOtpCode').value.trim();
            const newPassword = document.getElementById('resetNewPassword').value.trim();
            if (!code || !newPassword) { toast.warning('Vui lòng nhập đủ OTP và mật khẩu mới.'); return; }
            try {
                await api.put(`${CONFIG.ENDPOINTS.AUTH.FORGOT_PASSWORD}?gmail=${encodeURIComponent(email)}&code=${encodeURIComponent(code)}&newPassword=${encodeURIComponent(newPassword)}`);
                toast.success('Đặt lại mật khẩu thành công! Vui lòng đăng nhập.');
                forgotModal.classList.remove('active');
                step1.classList.remove('hidden');
                step2.classList.add('hidden');
            } catch (err) { toast.error(err.message); }
        });
    </script>
</body>
</html>
