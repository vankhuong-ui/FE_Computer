<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Danh mục — HK COMPUTER Admin</title>
    <link rel="stylesheet" href="./assets/css/admin.css" />
    <style>
        .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); backdrop-filter: blur(2px); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-backdrop.active { display: flex; }
        .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); max-width: 420px; width: 100%; padding: 28px; }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside id="adminSidebar"></aside>

        <div class="admin-main">
            <header id="adminTopbar"></header>

            <main class="admin-content-body">
                <div class="table-toolbar">
                    <div>
                        <h1 style="font-size: var(--text-2xl);">Danh mục Sản phẩm</h1>
                        <p style="font-size: var(--text-xs);">Quản lý nhóm sản phẩm (Laptop, PC, CPU, VGA, Phụ kiện...).</p>
                    </div>
                    <button type="button" id="btnAdd" class="btn btn-primary btn-sm">+ Thêm danh mục</button>
                </div>

                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr><th>ID</th><th>Tên danh mục</th><th>Slug</th><th>Thao tác</th></tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="4" style="text-align: center; padding: 32px;">Đang tải...</td></tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <div class="modal-backdrop" id="catModal">
        <div class="modal-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="font-size: var(--text-lg);" id="modalTitle">Thêm danh mục</h3>
                <button type="button" id="btnCloseModal" style="background:none; border:none; font-size:20px; cursor:pointer;">×</button>
            </div>
            <form id="catForm">
                <input type="hidden" id="editId" />
                <div class="form-group">
                    <label class="form-label" for="catName">Tên danh mục</label>
                    <input type="text" id="catName" class="input" required />
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" id="btnCancelModal" class="btn btn-secondary">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { api } from './assets/js/api.js';
        import { auth } from './assets/js/auth.js';
        import { CONFIG } from './assets/js/config.js';
        import { initAdminLayout } from './assets/js/admin-layout.js';
        import { toast } from './assets/js/toast.js';

        const modal = document.getElementById('catModal');
        const form = document.getElementById('catForm');
        let cats = [];

        async function loadCategories() {
            if (!auth.requireAdmin()) return;
            try {
                const res = await api.get(CONFIG.ENDPOINTS.CATEGORIES.LIST);
                cats = Array.isArray(res) ? res : [];
                const tbody = document.getElementById('tableBody');
                if (!cats.length) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:32px;">Chưa có danh mục nào.</td></tr>`;
                    return;
                }
                tbody.innerHTML = cats.map(c => `
                    <tr>
                        <td class="tabular-nums">#${c.id}</td>
                        <td style="font-weight: var(--font-semibold);">${c.nameCategories || c.name}</td>
                        <td class="mono-spec" style="font-size: var(--text-xs); color: var(--text-secondary);">${c.slug || '-'}</td>
                        <td>
                            <button type="button" class="btn btn-secondary btn-sm btn-edit" data-id="${c.id}">Sửa</button>
                            <button type="button" class="btn btn-outline btn-sm text-danger btn-del" data-id="${c.id}">Xóa</button>
                        </td>
                    </tr>
                `).join('');

                document.querySelectorAll('.btn-edit').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const c = cats.find(x => x.id === Number(btn.dataset.id));
                        if (!c) return;
                        document.getElementById('modalTitle').textContent = 'Cập nhật danh mục';
                        document.getElementById('editId').value = c.id;
                        document.getElementById('catName').value = c.nameCategories || c.name || '';
                        modal.classList.add('active');
                    });
                });

                document.querySelectorAll('.btn-del').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        if (!confirm('Xóa danh mục này?')) return;
                        try {
                            await api.delete(CONFIG.ENDPOINTS.CATEGORIES.DELETE(btn.dataset.id));
                            toast.success('Đã xóa danh mục.');
                            loadCategories();
                        } catch (err) { toast.error(err.message); }
                    });
                });
            } catch (err) {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="4" class="text-danger">${err.message}</td></tr>`;
            }
        }

        document.getElementById('btnAdd').addEventListener('click', () => {
            document.getElementById('modalTitle').textContent = 'Thêm danh mục';
            form.reset();
            document.getElementById('editId').value = '';
            modal.classList.add('active');
        });
        document.getElementById('btnCloseModal').addEventListener('click', () => modal.classList.remove('active'));
        document.getElementById('btnCancelModal').addEventListener('click', () => modal.classList.remove('active'));

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const name = document.getElementById('catName').value.trim();
            const slug = name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
            const payload = { nameCategories: name, slug };
            try {
                if (id) await api.put(CONFIG.ENDPOINTS.CATEGORIES.UPDATE(id), payload);
                else await api.post(CONFIG.ENDPOINTS.CATEGORIES.CREATE, payload);
                toast.success('Lưu danh mục thành công!');
                modal.classList.remove('active');
                loadCategories();
            } catch (err) { toast.error(err.message); }
        });

        document.addEventListener('DOMContentLoaded', () => { initAdminLayout({ active: 'categories', title: 'Quản lý Danh mục' }); loadCategories(); });
    </script>
</body>
</html>
