<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thiết lập mật khẩu — Hoang89 Computer</title>
    <link rel="stylesheet" href="./assets/css/base.css" />
    <link rel="stylesheet" href="./assets/css/components.css" />
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 24px;
            background-color: var(--canvas);
        }
        .auth-container { width: 100%; max-width: 420px; }
        .auth-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 24px;">
                <a href="index.html" style="font-size: var(--text-xs); font-weight: var(--font-semibold); text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary);">Hoang89 Computer</a>
                <h1 style="font-size: var(--text-2xl); margin: 8px 0 6px;" id="pageTitle">Đổi mật khẩu</h1>
                <p style="font-size: var(--text-xs); color: var(--text-secondary);" id="pageSubtitle">Cập nhật mật khẩu bảo mật cho tài khoản của bạn</p>
            </div>

            <form id="passwordForm">
                <div class="form-group" id="oldPasswordGroup">
                    <label class="form-label" for="oldPassword">Mật khẩu hiện tại</label>
                    <input type="password" id="oldPassword" class="input" placeholder="••••••••" />
                </div>

                <div class="form-group">
                    <label class="form-label" for="newPassword">Mật khẩu mới</label>
                    <input type="password" id="newPassword" class="input" placeholder="Tối thiểu 6 ký tự" required minlength="6" />
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Xác nhận mật khẩu mới</label>
                    <input type="password" id="confirmPassword" class="input" placeholder="Nhập lại mật khẩu mới" required minlength="6" />
                </div>

                <button type="submit" id="btnSubmit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
                    Lưu mật khẩu
                </button>
            </form>

            <div style="text-align: center; margin-top: 20px; font-size: var(--text-xs);">
                <a href="profile.html" style="text-decoration: underline;">← Quay lại hồ sơ cá nhân</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { api } from './assets/js/api.js';
        import { auth } from './assets/js/auth.js';
        import { CONFIG } from './assets/js/config.js';
        import { toast } from './assets/js/toast.js';

        let hasExistingPassword = true;

        async function init() {
            if (!auth.requireAuth()) return;
            try {
                const res = await api.get(CONFIG.ENDPOINTS.AUTH.CHECK_PASSWORD);
                hasExistingPassword = res?.hasPassword !== false;
                if (!hasExistingPassword) {
                    document.getElementById('oldPasswordGroup').style.display = 'none';
                    document.getElementById('pageTitle').textContent = 'Tạo mật khẩu đăng nhập';
                    document.getElementById('pageSubtitle').textContent = 'Tài khoản Google của bạn chưa có mật khẩu. Hãy đặt mật khẩu để đăng nhập bằng email.';
                }
            } catch (_) {}
        }

        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const oldPassword = document.getElementById('oldPassword').value || '';
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                toast.warning('Mật khẩu xác nhận không khớp.');
                return;
            }

            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.textContent = 'Đang lưu...';

            try {
                await api.post(`${CONFIG.ENDPOINTS.AUTH.SET_GOOGLE_PASSWORD}?password=${encodeURIComponent(oldPassword)}&newPassword=${encodeURIComponent(newPassword)}`);
                toast.success('Cập nhật mật khẩu thành công!');
                setTimeout(() => {
                    window.location.href = CONFIG.ROUTES.PROFILE;
                }, 900);
            } catch (err) {
                toast.error(err.message || 'Không thể cập nhật mật khẩu.');
                btn.disabled = false;
                btn.textContent = 'Lưu mật khẩu';
            }
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
