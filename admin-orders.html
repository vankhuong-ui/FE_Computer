<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Đơn hàng — HK COMPUTER Admin</title>
    <link rel="stylesheet" href="./assets/css/admin.css" />
    <style>
        .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); backdrop-filter: blur(2px); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-backdrop.active { display: flex; }
        .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); max-width: 420px; width: 100%; padding: 28px; }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside id="adminSidebar"></aside>

        <div class="admin-main">
            <header id="adminTopbar"></header>

            <main class="admin-content-body">
                <div class="table-toolbar">
                    <div>
                        <h1 style="font-size: var(--text-2xl);">Danh sách Đơn hàng</h1>
                        <p style="font-size: var(--text-xs);">Theo dõi đơn đặt hàng và cập nhật trạng thái thanh toán.</p>
                    </div>
                </div>

                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr><th>Mã đơn</th><th>Khách hàng</th><th>Tổng tiền</th><th>Trạng thái</th><th>Ngày đặt</th><th>Thao tác</th></tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="6" style="text-align: center; padding: 32px;">Đang tải...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div id="paginationBar" style="display: flex; justify-content: center; gap: 8px; margin-top: 20px;"></div>
            </main>
        </div>
    </div>

    <div class="modal-backdrop" id="statusModal">
        <div class="modal-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="font-size: var(--text-lg);">Cập nhật trạng thái đơn</h3>
                <button type="button" id="btnCloseModal" style="background:none; border:none; font-size:20px; cursor:pointer;">×</button>
            </div>
            <form id="statusForm">
                <input type="hidden" id="editOrderId" />
                <div class="form-group">
                    <label class="form-label" for="editStatus">Trạng thái</label>
                    <select id="editStatus" class="select">
                        <option value="UNPAID">UNPAID — Chưa thanh toán</option>
                        <option value="COMPLETED">COMPLETED — Đã thanh toán & Hoàn tất</option>
                        <option value="CANCELLED">CANCELLED — Đã hủy</option>
                    </select>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" id="btnCancelModal" class="btn btn-secondary">Hủy</button>
                    <button type="submit" class="btn btn-primary">Cập nhật</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { api } from './assets/js/api.js';
        import { auth } from './assets/js/auth.js';
        import { CONFIG } from './assets/js/config.js';
        import { initAdminLayout } from './assets/js/admin-layout.js';
        import { toast } from './assets/js/toast.js';

        let currentPage = 0;

        function formatPrice(p) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(p || 0);
        }

        function getBadge(s) {
            if (s === 'COMPLETED') return '<span class="badge badge-success">Hoàn thành</span>';
            if (s === 'UNPAID') return '<span class="badge badge-warning">Chưa thanh toán</span>';
            if (s === 'CANCELLED') return '<span class="badge badge-danger">Đã hủy</span>';
            return `<span class="badge">${s}</span>`;
        }

        async function loadOrders(page = 0) {
            if (!auth.requireAdmin()) return;
            currentPage = page;
            try {
                const data = await api.get(CONFIG.ENDPOINTS.ORDERS.LIST, { page_no: page, page_size: 10, sortBy: 'createdAt', sortDir: 'desc' });
                const items = data?.content || [];
                const totalPages = data?.totalPages || 1;
                const tbody = document.getElementById('tableBody');

                if (!items.length) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:32px;">Chưa có đơn hàng nào.</td></tr>`;
                    return;
                }

                tbody.innerHTML = items.map(o => `
                    <tr>
                        <td class="tabular-nums">#${o.id}</td>
                        <td>
                            <div style="font-weight: var(--font-medium);">${o.useraddress?.username || 'Khách hàng'}</div>
                            <div class="tabular-nums" style="font-size: var(--text-xs); color: var(--text-secondary);">${o.useraddress?.phone || ''}</div>
                        </td>
                        <td class="tabular-nums" style="font-weight: var(--font-semibold);">${formatPrice(o.totalAmount)}</td>
                        <td>${getBadge(o.status)}</td>
                        <td class="tabular-nums" style="font-size: var(--text-xs);">${o.createdAt ? new Date(o.createdAt).toLocaleString('vi-VN') : '-'}</td>
                        <td>
                            <button type="button" class="btn btn-secondary btn-sm btn-edit" data-id="${o.id}" data-status="${o.status}">Cập nhật</button>
                        </td>
                    </tr>
                `).join('');

                document.querySelectorAll('.btn-edit').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.getElementById('editOrderId').value = btn.dataset.id;
                        document.getElementById('editStatus').value = btn.dataset.status;
                        document.getElementById('statusModal').classList.add('active');
                    });
                });

                const pag = document.getElementById('paginationBar');
                pag.innerHTML = totalPages > 1 ? Array.from({ length: totalPages }, (_, i) =>
                    `<button class="btn btn-sm ${i === page ? 'btn-primary' : 'btn-secondary'}" data-page="${i}">${i + 1}</button>`
                ).join('') : '';
                pag.querySelectorAll('button').forEach(b => b.addEventListener('click', () => loadOrders(Number(b.dataset.page))));
            } catch (err) {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="6" class="text-danger">${err.message}</td></tr>`;
            }
        }

        document.getElementById('btnCloseModal').addEventListener('click', () => document.getElementById('statusModal').classList.remove('active'));
        document.getElementById('btnCancelModal').addEventListener('click', () => document.getElementById('statusModal').classList.remove('active'));

        document.getElementById('statusForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editOrderId').value;
            const status = document.getElementById('editStatus').value;
            try {
                await api.put(CONFIG.ENDPOINTS.ORDERS.ADMIN_UPDATE_STATUS(id, status));
                toast.success('Cập nhật trạng thái đơn hàng thành công!');
                document.getElementById('statusModal').classList.remove('active');
                loadOrders(currentPage);
            } catch (err) { toast.error(err.message); }
        });

        document.addEventListener('DOMContentLoaded', () => { initAdminLayout({ active: 'orders', title: 'Quản lý Đơn hàng' }); loadOrders(0); });
    </script>
</body>
</html>
