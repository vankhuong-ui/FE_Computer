<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Đơn hàng — HK COMPUTER Admin</title>
    <link rel="stylesheet" href="./assets/css/admin.css?v=6" />
    <style>
        .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); backdrop-filter: blur(2px); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-backdrop.active { display: flex; }
        .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); max-width: 420px; width: 100%; padding: 28px; }

        .status-tabs {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 4px;
            margin-bottom: 14px;
        }

        .status-tab {
            flex: 1;
            min-width: max-content;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 9px 14px;
            border: none;
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: var(--text-xs);
            font-weight: 600;
            cursor: pointer;
            transition: background-color var(--transition-fast), color var(--transition-fast);
        }

        .status-tab:hover {
            background: var(--surface-hover);
            color: var(--text-primary);
        }

        .status-tab.active {
            background: var(--brand-green-soft);
            color: var(--brand-green);
        }

        .tab-count {
            min-width: 20px;
            padding: 1px 6px;
            border-radius: var(--radius-xs);
            background: var(--surface-subtle);
            border: 1px solid var(--border);
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-secondary);
        }

        .status-tab.active .tab-count {
            background: var(--brand-green);
            border-color: var(--brand-green);
            color: #FFFFFF;
        }

        .admin-items-mini {
            display: flex;
            flex-direction: column;
            gap: 3px;
            max-width: 340px;
        }

        .admin-item-line {
            font-size: var(--text-xs);
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside id="adminSidebar"></aside>

        <div class="admin-main">
            <header id="adminTopbar"></header>

            <main class="admin-content-body">
                <div class="table-toolbar">
                    <div>
                        <h1 style="font-size: var(--text-2xl); margin-bottom: 2px;">Quản lý đơn hàng</h1>
                        <p style="font-size: var(--text-xs);">Đơn mới nhất xếp trên cùng, lọc nhanh theo trạng thái thanh toán.</p>
                    </div>
                    <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                        <input type="search" id="adminOrderSearch" class="input" style="width: 240px;" placeholder="Tìm mã đơn hoặc sản phẩm..." />
                    </div>
                </div>

                <div class="status-tabs" id="adminStatusTabs" role="tablist"></div>

                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Mã đơn</th>
                                <th>Sản phẩm đặt mua</th>
                                <th>Tổng tiền</th>
                                <th>Trạng thái</th>
                                <th>Ngày đặt</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="6" style="text-align: center; padding: 32px;">Đang tải...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div id="paginationBar" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 16px;"></div>
            </main>
        </div>
    </div>

    <div class="modal-backdrop" id="statusModal">
        <div class="modal-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="font-size: var(--text-lg);">Cập nhật trạng thái đơn</h3>
                <button type="button" id="btnCloseModal" style="background:none; border:none; font-size:20px; cursor:pointer;">×</button>
            </div>
            <form id="statusForm">
                <input type="hidden" id="editOrderId" />
                <div class="form-group">
                    <label class="form-label" for="editStatus">Trạng thái</label>
                    <select id="editStatus" class="select">
                        <option value="UNPAID">Chờ thanh toán (UNPAID)</option>
                        <option value="COMPLETED">Đã thanh toán &amp; Kích hoạt BH (COMPLETED)</option>
                        <option value="CANCELLED">Đã hủy (CANCELLED)</option>
                    </select>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" id="btnCancelModal" class="btn btn-secondary">Đóng</button>
                    <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { api } from './assets/js/api.js';
        import { auth } from './assets/js/auth.js';
        import { CONFIG } from './assets/js/config.js';
        import { initAdminLayout } from './assets/js/admin-layout.js?v=6';
        import { toast } from './assets/js/toast.js';

        const PAGE_SIZE = 10;
        const TABS = [
            { key: 'ALL', label: 'Tất cả đơn' },
            { key: 'UNPAID', label: 'Chờ thanh toán' },
            { key: 'COMPLETED', label: 'Đã thanh toán' },
            { key: 'CANCELLED', label: 'Đã hủy' }
        ];

        let allOrders = [];
        let activeTab = 'ALL';
        let searchQuery = '';
        let currentPage = 0;

        function formatPrice(p) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(p || 0);
        }

        function getBadge(s) {
            if (s === 'COMPLETED') return '<span class="badge badge-success">Đã thanh toán</span>';
            if (s === 'UNPAID') return '<span class="badge badge-warning">Chờ thanh toán</span>';
            if (s === 'CANCELLED') return '<span class="badge badge-danger">Đã hủy</span>';
            return `<span class="badge">${s || '-'}</span>`;
        }

        function renderTabs() {
            const counts = { ALL: allOrders.length, UNPAID: 0, COMPLETED: 0, CANCELLED: 0 };
            allOrders.forEach(o => {
                const st = (o.status || '').toUpperCase();
                if (counts[st] !== undefined) counts[st]++;
            });
            const host = document.getElementById('adminStatusTabs');
            host.innerHTML = TABS.map(t => `
                <button type="button" class="status-tab ${activeTab === t.key ? 'active' : ''}" data-tab="${t.key}">
                    <span>${t.label}</span>
                    <span class="tab-count">${counts[t.key]}</span>
                </button>
            `).join('');
            host.querySelectorAll('.status-tab').forEach(btn => {
                btn.addEventListener('click', () => {
                    activeTab = btn.dataset.tab;
                    currentPage = 0;
                    renderTable();
                });
            });
        }

        function renderTable() {
            renderTabs();
            const q = searchQuery.trim().toLowerCase().replace(/^#/, '');
            let filtered = allOrders.filter(o => activeTab === 'ALL' || (o.status || '').toUpperCase() === activeTab);
            if (q) {
                filtered = filtered.filter(o =>
                    String(o.id).includes(q) ||
                    (o.orderItems || []).some(it => (it.product?.nameProduct || '').toLowerCase().includes(q))
                );
            }

            const tbody = document.getElementById('tableBody');
            const pag = document.getElementById('paginationBar');

            if (!filtered.length) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:36px; color: var(--text-secondary);">Không có đơn hàng nào trong mục này.</td></tr>`;
                pag.innerHTML = '';
                return;
            }

            const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
            if (currentPage >= totalPages) currentPage = totalPages - 1;
            const start = currentPage * PAGE_SIZE;
            const pageItems = filtered.slice(start, start + PAGE_SIZE);

            tbody.innerHTML = pageItems.map(o => {
                const items = o.orderItems || [];
                const itemsSummary = items.length
                    ? items.map(it => `<div class="admin-item-line">${it.quantity || 1}× ${it.product?.nameProduct || 'Sản phẩm'}</div>`).join('')
                    : '<span style="color: var(--text-muted); font-size: var(--text-xs);">Không có chi tiết</span>';

                return `
                    <tr>
                        <td class="tabular-nums" style="font-weight: 700;">#${o.id}</td>
                        <td><div class="admin-items-mini">${itemsSummary}</div></td>
                        <td class="tabular-nums" style="font-weight: var(--font-semibold); color: var(--brand-orange);">${formatPrice(o.totalAmount)}</td>
                        <td>${getBadge(o.status)}</td>
                        <td class="tabular-nums" style="font-size: var(--text-xs); color: var(--text-secondary);">${o.createdAt ? new Date(o.createdAt).toLocaleString('vi-VN') : '-'}</td>
                        <td>
                            <button type="button" class="btn btn-secondary btn-sm btn-edit" data-id="${o.id}" data-status="${o.status}">Cập nhật</button>
                        </td>
                    </tr>
                `;
            }).join('');

            document.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.getElementById('editOrderId').value = btn.dataset.id;
                    document.getElementById('editStatus').value = btn.dataset.status;
                    document.getElementById('statusModal').classList.add('active');
                });
            });

            const end = Math.min(start + PAGE_SIZE, filtered.length);
            const buttonsHtml = totalPages > 1 ? Array.from({ length: totalPages }, (_, i) =>
                `<button class="btn btn-sm ${i === currentPage ? 'btn-primary' : 'btn-secondary'}" data-page="${i}">${i + 1}</button>`
            ).join('') : '';

            pag.innerHTML = `
                <span class="tabular-nums" style="font-size: var(--text-xs); color: var(--text-secondary);">Hiển thị ${start + 1}–${end} / ${filtered.length} đơn</span>
                <div style="display: flex; gap: 6px;">${buttonsHtml}</div>
            `;
            pag.querySelectorAll('button[data-page]').forEach(b => b.addEventListener('click', () => {
                currentPage = Number(b.dataset.page);
                renderTable();
            }));
        }

        async function loadOrders() {
            if (!auth.requireAdmin()) return;
            try {
                const data = await api.get(CONFIG.ENDPOINTS.ORDERS.LIST, { page_no: 0, page_size: 200, sortBy: 'createdAt', sortDir: 'desc' });
                const raw = data?.content || [];
                // Ensure newest orders are always at the top
                allOrders = [...raw].sort((a, b) => {
                    const ta = a.createdAt ? new Date(a.createdAt).getTime() : 0;
                    const tb = b.createdAt ? new Date(b.createdAt).getTime() : 0;
                    return (tb - ta) || (b.id - a.id);
                });
                renderTable();
            } catch (err) {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="6" class="text-danger">${err.message}</td></tr>`;
            }
        }

        document.getElementById('adminOrderSearch').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            currentPage = 0;
            renderTable();
        });

        document.getElementById('btnCloseModal').addEventListener('click', () => document.getElementById('statusModal').classList.remove('active'));
        document.getElementById('btnCancelModal').addEventListener('click', () => document.getElementById('statusModal').classList.remove('active'));

        document.getElementById('statusForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editOrderId').value;
            const status = document.getElementById('editStatus').value;
            try {
                await api.put(CONFIG.ENDPOINTS.ORDERS.ADMIN_UPDATE_STATUS(id, status));
                toast.success('Đã cập nhật trạng thái đơn hàng.');
                document.getElementById('statusModal').classList.remove('active');
                loadOrders();
            } catch (err) { toast.error(err.message); }
        });

        document.addEventListener('DOMContentLoaded', () => { initAdminLayout({ active: 'orders', title: 'Quản lý Đơn hàng' }); loadOrders(); });
    </script>
</body>
</html>
