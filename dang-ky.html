<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Ký Tài Khoản — Hoang89 Computer</title>
    <link rel="stylesheet" href="./assets/css/base.css" />
    <link rel="stylesheet" href="./assets/css/components.css" />
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 24px;
            background-color: var(--canvas);
        }
        .auth-container { width: 100%; max-width: 420px; }
        .auth-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px;
        }
        .auth-header { margin-bottom: 24px; text-align: center; }
        .auth-brand {
            font-size: var(--text-sm);
            font-weight: var(--font-semibold);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: inline-block;
        }
        .auth-title { font-size: var(--text-2xl); letter-spacing: -0.025em; margin-bottom: 6px; }
        .auth-subtitle { font-size: var(--text-xs); color: var(--text-secondary); }
        .auth-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: var(--text-xs);
        }
        .auth-divider::before, .auth-divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border); }
        .auth-divider span { padding: 0 10px; }
        .auth-links { margin-top: 24px; text-align: center; font-size: var(--text-xs); color: var(--text-secondary); }
        .auth-links a { color: var(--text-primary); font-weight: var(--font-medium); text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="auth-brand">Hoang89 Computer</a>
                <h1 class="auth-title">Tạo tài khoản</h1>
                <p class="auth-subtitle">Đăng ký để mua sắm, theo dõi đơn hàng và bảo hành điện tử</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="accountname">Tên hiển thị</label>
                    <input type="text" id="accountname" class="input" placeholder="Nguyễn Văn A" required minlength="2" />
                </div>

                <div class="form-group">
                    <label class="form-label" for="gmail">Địa chỉ Gmail</label>
                    <input type="email" id="gmail" class="input" placeholder="tenban@gmail.com" required autocomplete="email" />
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Mật khẩu</label>
                    <input type="password" id="password" class="input" placeholder="Tối thiểu 6 ký tự" required minlength="6" autocomplete="new-password" />
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Xác nhận mật khẩu</label>
                    <input type="password" id="confirmPassword" class="input" placeholder="Nhập lại mật khẩu" required minlength="6" autocomplete="new-password" />
                </div>

                <button type="submit" id="btnRegister" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
                    Đăng ký tài khoản
                </button>
            </form>

            <div class="auth-divider"><span>Hoặc đăng ký nhanh</span></div>

            <button type="button" id="btnGoogleLogin" class="btn btn-secondary" style="width: 100%;">
                <svg width="16" height="16" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.55 10.78l7.98-6.19z" />
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                </svg>
                <span>Google Account</span>
            </button>

            <div class="auth-links">
                Đã có tài khoản? <a href="dang-nhap.html">Đăng nhập</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { api } from './assets/js/api.js';
        import { CONFIG } from './assets/js/config.js';
        import { toast } from './assets/js/toast.js';

        const registerForm = document.getElementById('registerForm');
        const btnRegister = document.getElementById('btnRegister');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const accountname = document.getElementById('accountname').value.trim();
            const gmail = document.getElementById('gmail').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                toast.warning('Mật khẩu xác nhận không khớp.');
                return;
            }

            btnRegister.disabled = true;
            btnRegister.textContent = 'Đang tạo tài khoản...';

            try {
                await api.post(CONFIG.ENDPOINTS.AUTH.REGISTER, { accountname, gmail, password });
                sessionStorage.setItem('pendingVerifyGmail', gmail);

                // Gửi mã OTP kích hoạt tài khoản
                api.post(`${CONFIG.ENDPOINTS.AUTH.SEND_OTP}?gmail=${encodeURIComponent(gmail)}`).catch(() => {});

                toast.success('Đăng ký thành công! Vui lòng kiểm tra Gmail để lấy mã OTP.');
                setTimeout(() => {
                    window.location.href = `xac-thuc-otp.html?gmail=${encodeURIComponent(gmail)}`;
                }, 900);
            } catch (err) {
                toast.error(err.message || 'Không thể đăng ký tài khoản.');
                btnRegister.disabled = false;
                btnRegister.textContent = 'Đăng ký tài khoản';
            }
        });

        document.getElementById('btnGoogleLogin').addEventListener('click', () => {
            window.location.href = `${CONFIG.API_BASE_URL}/oauth2/authorization/google`;
        });
    </script>
</body>
</html>
