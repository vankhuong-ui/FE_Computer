<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hỗ trợ kỹ thuật — HK COMPUTER</title>
    <link rel="stylesheet" href="./assets/css/base.css?v=6" />
    <link rel="stylesheet" href="./assets/css/components.css?v=6" />
    <style>
        .page-header {
            padding: 36px 0 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }
        .support-grid {
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 24px;
            margin-bottom: 64px;
        }
        @media (max-width: 860px) {
            .support-grid { grid-template-columns: 1fr; }
        }
        .ticket-item {
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-bottom: 12px;
            background: var(--surface-subtle);
        }
    </style>
</head>
<body>
    <header id="appHeader"></header>

    <main class="container">
        <div class="page-header">
            <div>
                <h1 style="font-size: var(--text-2xl);">Hỗ trợ kỹ thuật & CSKH</h1>
                <p style="font-size: var(--text-xs);">Gửi yêu cầu tư vấn lắp ráp, cài đặt phần mềm hoặc phản hồi dịch vụ.</p>
            </div>
            <a href="warranty.html" class="btn btn-secondary btn-sm">Trung tâm Bảo hành</a>
        </div>

        <div class="support-grid">
            <div class="card" style="height: fit-content;">
                <h3 style="font-size: var(--text-lg); margin-bottom: 16px;">Gửi yêu cầu mới</h3>
                <form id="supportForm">
                    <div class="form-group">
                        <label class="form-label" for="subject">Tiêu đề yêu cầu</label>
                        <input type="text" id="subject" class="input" placeholder="Ví dụ: Tư vấn nâng cấp RAM cho laptop..." required />
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="message">Nội dung chi tiết</label>
                        <textarea id="message" class="textarea" rows="5" placeholder="Mô tả vấn đề hoặc cấu hình bạn đang sử dụng..." required></textarea>
                    </div>
                    <button type="submit" id="btnSubmit" class="btn btn-primary" style="width: 100%;">
                        Gửi yêu cầu hỗ trợ
                    </button>
                </form>
            </div>

            <div class="card">
                <h3 style="font-size: var(--text-lg); margin-bottom: 16px;">Lịch sử yêu cầu của bạn</h3>
                <div id="ticketList">
                    <p style="font-size: var(--text-xs);">Đang tải danh sách yêu cầu...</p>
                </div>
            </div>
        </div>
    </main>

    <footer id="appFooter"></footer>

    <script type="module">
        import { api } from './assets/js/api.js';
        import { auth } from './assets/js/auth.js';
        import { cart } from './assets/js/cart.js';
        import { CONFIG } from './assets/js/config.js';
        import { initStoreLayout } from './assets/js/layout.js?v=6';
        import { toast } from './assets/js/toast.js';
        import './assets/js/chat-widget.js?v=6';

        function getStatusBadge(status) {
            const s = (status || '').toUpperCase();
            if (s === 'OPEN') return `<span class="badge badge-warning">Đang mở</span>`;
            if (s === 'IN_PROGRESS') return `<span class="badge badge-info">Đang xử lý</span>`;
            if (s === 'CLOSED') return `<span class="badge badge-success">Đã hoàn tất</span>`;
            return `<span class="badge">${status}</span>`;
        }

        async function loadTickets() {
            if (!auth.isAuthenticated()) {
                document.getElementById('ticketList').innerHTML = `<p style="font-size: var(--text-sm);">Vui lòng <a href="dang-nhap.html" style="text-decoration:underline;">đăng nhập</a> để gửi và xem lịch sử hỗ trợ.</p>`;
                return;
            }
            try {
                const data = await api.get(CONFIG.ENDPOINTS.SUPPORT.MY_REQUESTS, { page: 0, size: 20 });
                const items = data?.content || [];
                if (!items.length) {
                    document.getElementById('ticketList').innerHTML = `<p style="font-size: var(--text-sm);">Bạn chưa có yêu cầu hỗ trợ nào.</p>`;
                    return;
                }
                document.getElementById('ticketList').innerHTML = items.map(t => `
                    <div class="ticket-item">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                            <span style="font-weight: var(--font-semibold); font-size: var(--text-sm);">${t.subject}</span>
                            ${getStatusBadge(t.status)}
                        </div>
                        <p style="font-size: var(--text-xs); margin-bottom: 6px;">${t.message}</p>
                        <div style="font-size: 11px; color: var(--text-muted);" class="tabular-nums">${new Date(t.createdAt).toLocaleString('vi-VN')}</div>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('ticketList').innerHTML = `<p class="text-danger">${err.message}</p>`;
            }
        }

        document.getElementById('supportForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!auth.isAuthenticated()) {
                toast.warning('Vui lòng đăng nhập để gửi yêu cầu hỗ trợ.');
                setTimeout(() => auth.requireAuth(), 900);
                return;
            }
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            try {
                await api.post(CONFIG.ENDPOINTS.SUPPORT.CREATE, {
                    subject: document.getElementById('subject').value.trim(),
                    message: document.getElementById('message').value.trim()
                });
                toast.success('Đã gửi yêu cầu hỗ trợ thành công!');
                document.getElementById('supportForm').reset();
                loadTickets();
            } catch (err) {
                toast.error(err.message || 'Không thể gửi yêu cầu.');
            } finally {
                btn.disabled = false;
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            initStoreLayout({ activeNav: 'support' });
            cart.updateHeaderBadge();
            loadTickets();
        });
    </script>
</body>
</html>
