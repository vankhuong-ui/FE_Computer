<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Tồn kho — HK COMPUTER Admin</title>
    <link rel="stylesheet" href="./assets/css/admin.css?v=6" />
    <style>
        .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); backdrop-filter: blur(2px); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-backdrop.active { display: flex; }
        .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); max-width: 440px; width: 100%; padding: 28px; }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside id="adminSidebar"></aside>

        <div class="admin-main">
            <header id="adminTopbar"></header>

            <main class="admin-content-body">
                <div class="table-toolbar">
                    <div>
                        <h1 style="font-size: var(--text-2xl);">Tồn kho Sản phẩm</h1>
                        <p style="font-size: var(--text-xs);">Theo dõi số lượng tồn kho và nhập bổ sung hàng hóa.</p>
                    </div>
                    <button type="button" id="btnAddInv" class="btn btn-primary btn-sm">+ Tạo kho sản phẩm</button>
                </div>

                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr><th>ID Kho</th><th>Sản phẩm</th><th>Số lượng tồn</th><th>Trạng thái</th><th>Thao tác</th></tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="5" style="text-align: center; padding: 32px;">Đang tải...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div id="paginationBar" style="display: flex; justify-content: center; gap: 8px; margin-top: 20px;"></div>
            </main>
        </div>
    </div>

    <!-- Import Stock Modal -->
    <div class="modal-backdrop" id="stockModal">
        <div class="modal-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="font-size: var(--text-lg);">Nhập thêm hàng vào kho</h3>
                <button type="button" id="btnCloseStock" style="background:none; border:none; font-size:20px; cursor:pointer;">×</button>
            </div>
            <form id="stockForm">
                <input type="hidden" id="stockInvId" />
                <div class="form-group">
                    <label class="form-label" for="stockQty">Số lượng nhập thêm</label>
                    <input type="number" id="stockQty" class="input tabular-nums" min="1" required />
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" id="btnCancelStock" class="btn btn-secondary">Hủy</button>
                    <button type="submit" class="btn btn-primary">Xác nhận nhập</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Create Inventory Modal -->
    <div class="modal-backdrop" id="createModal">
        <div class="modal-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="font-size: var(--text-lg);">Khởi tạo kho cho sản phẩm</h3>
                <button type="button" id="btnCloseCreate" style="background:none; border:none; font-size:20px; cursor:pointer;">×</button>
            </div>
            <form id="createForm">
                <div class="form-group">
                    <label class="form-label" for="createProdId">Chọn sản phẩm</label>
                    <select id="createProdId" class="select" required></select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="createQty">Số lượng ban đầu</label>
                    <input type="number" id="createQty" class="input tabular-nums" min="0" value="10" required />
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" id="btnCancelCreate" class="btn btn-secondary">Hủy</button>
                    <button type="submit" class="btn btn-primary">Khởi tạo</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { api } from './assets/js/api.js';
        import { auth } from './assets/js/auth.js';
        import { CONFIG } from './assets/js/config.js';
        import { initAdminLayout } from './assets/js/admin-layout.js?v=6';
        import { toast } from './assets/js/toast.js';

        let currentPage = 0;

        async function loadInventory(page = 0) {
            if (!auth.requireAdmin()) return;
            currentPage = page;
            try {
                const data = await api.get(CONFIG.ENDPOINTS.INVENTORY.LIST, { page_no: page, page_size: 10, sortBy: 'id', sortDir: 'asc' });
                const items = data?.content || [];
                const totalPages = data?.totalPages || 1;
                const tbody = document.getElementById('tableBody');

                if (!items.length) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:32px;">Chưa có dữ liệu tồn kho.</td></tr>`;
                    return;
                }

                tbody.innerHTML = items.map(inv => `
                    <tr>
                        <td class="tabular-nums">#${inv.id}</td>
                        <td style="font-weight: var(--font-medium);">${inv.nameProduct || inv.products?.nameProduct || 'Sản phẩm'}</td>
                        <td class="tabular-nums" style="font-weight: var(--font-semibold);">${inv.soluong}</td>
                        <td>${inv.soluong > 0 ? '<span class="badge badge-success">Còn hàng</span>' : '<span class="badge badge-danger">Hết hàng</span>'}</td>
                        <td>
                            <button type="button" class="btn btn-secondary btn-sm btn-import" data-id="${inv.id}">+ Nhập hàng</button>
                        </td>
                    </tr>
                `).join('');

                document.querySelectorAll('.btn-import').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.getElementById('stockInvId').value = btn.dataset.id;
                        document.getElementById('stockQty').value = 10;
                        document.getElementById('stockModal').classList.add('active');
                    });
                });

                const pag = document.getElementById('paginationBar');
                pag.innerHTML = totalPages > 1 ? Array.from({ length: totalPages }, (_, i) =>
                    `<button class="btn btn-sm ${i === page ? 'btn-primary' : 'btn-secondary'}" data-page="${i}">${i + 1}</button>`
                ).join('') : '';
                pag.querySelectorAll('button').forEach(b => b.addEventListener('click', () => loadInventory(Number(b.dataset.page))));
            } catch (err) {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="5" class="text-danger">${err.message}</td></tr>`;
            }
        }

        document.getElementById('btnAddInv').addEventListener('click', async () => {
            try {
                const prods = await api.get(CONFIG.ENDPOINTS.PRODUCTS.LIST, { page_no: 0, page_size: 200 });
                document.getElementById('createProdId').innerHTML = (prods?.content || []).map(p => `<option value="${p.id}">${p.nameProduct}</option>`).join('');
                document.getElementById('createModal').classList.add('active');
            } catch (err) { toast.error(err.message); }
        });

        document.getElementById('btnCloseStock').addEventListener('click', () => document.getElementById('stockModal').classList.remove('active'));
        document.getElementById('btnCancelStock').addEventListener('click', () => document.getElementById('stockModal').classList.remove('active'));
        document.getElementById('btnCloseCreate').addEventListener('click', () => document.getElementById('createModal').classList.remove('active'));
        document.getElementById('btnCancelCreate').addEventListener('click', () => document.getElementById('createModal').classList.remove('active'));

        document.getElementById('stockForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('stockInvId').value;
            const qty = document.getElementById('stockQty').value;
            try {
                await api.put(`${CONFIG.ENDPOINTS.INVENTORY.UPDATE_STOCK(id)}?luongnhap=${qty}`);
                toast.success('Đã nhập kho thành công!');
                document.getElementById('stockModal').classList.remove('active');
                loadInventory(currentPage);
            } catch (err) { toast.error(err.message); }
        });

        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await api.post(CONFIG.ENDPOINTS.INVENTORY.CREATE, {
                    productId: Number(document.getElementById('createProdId').value),
                    soluong: Number(document.getElementById('createQty').value)
                });
                toast.success('Khởi tạo tồn kho thành công!');
                document.getElementById('createModal').classList.remove('active');
                loadInventory(currentPage);
            } catch (err) { toast.error(err.message); }
        });

        document.addEventListener('DOMContentLoaded', () => { initAdminLayout({ active: 'inventory', title: 'Quản lý Tồn kho' }); loadInventory(0); });
    </script>
</body>
</html>
