<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập Quản trị — HK COMPUTER Admin</title>
    <link rel="stylesheet" href="./assets/css/base.css?v=6" />
    <link rel="stylesheet" href="./assets/css/components.css?v=6" />
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 24px;
            background-color: var(--canvas);
        }
        .auth-container { width: 100%; max-width: 400px; }
        .auth-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 24px;">
                <span class="badge badge-info" style="margin-bottom: 10px;">ADMIN PORTAL</span>
                <h1 style="font-size: var(--text-2xl); margin-bottom: 6px;">Đăng nhập Quản trị</h1>
                <p style="font-size: var(--text-xs); color: var(--text-secondary);">Hệ thống quản lý cửa hàng & bảo hành HK COMPUTER</p>
            </div>

            <form id="adminLoginForm">
                <div class="form-group">
                    <label class="form-label" for="gmail">Email Quản trị viên</label>
                    <input type="email" id="gmail" class="input" placeholder="admin@hkcomputer.vn" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Mật khẩu</label>
                    <input type="password" id="password" class="input" placeholder="••••••••" required />
                </div>

                <button type="submit" id="btnAdminLogin" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
                    Truy cập Dashboard
                </button>
            </form>

            <div style="text-align: center; margin-top: 20px; font-size: var(--text-xs);">
                <a href="index.html" style="text-decoration: underline;">← Quay lại trang cửa hàng</a>
            </div>
        </div>
    </div>

    <script type="module">
        import './assets/js/theme.js';
        import { auth } from './assets/js/auth.js';
        import { CONFIG } from './assets/js/config.js';
        import { toast } from './assets/js/toast.js';

        if (auth.isAuthenticated() && auth.isAdmin()) {
            window.location.href = CONFIG.ROUTES.ADMIN_DASHBOARD;
        }

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const gmail = document.getElementById('gmail').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btnAdminLogin');

            btn.disabled = true;
            btn.textContent = 'Đang xác thực...';

            try {
                await auth.login(gmail, password);
                if (!auth.isAdmin()) {
                    toast.error('Tài khoản này không có quyền Quản trị viên (ADMIN).');
                    btn.disabled = false;
                    btn.textContent = 'Truy cập Dashboard';
                    return;
                }
                toast.success('Đăng nhập quản trị thành công!');
                setTimeout(() => {
                    window.location.href = CONFIG.ROUTES.ADMIN_DASHBOARD;
                }, 600);
            } catch (err) {
                toast.error(err.message || 'Thông tin đăng nhập không chính xác.');
                btn.disabled = false;
                btn.textContent = 'Truy cập Dashboard';
            }
        });
    </script>
</body>
</html>
