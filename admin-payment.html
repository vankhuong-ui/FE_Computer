<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Thanh toán — HK COMPUTER Admin</title>
    <link rel="stylesheet" href="./assets/css/admin.css?v=6" />
</head>
<body>
    <div class="admin-layout">
        <aside id="adminSidebar"></aside>

        <div class="admin-main">
            <header id="adminTopbar"></header>

            <main class="admin-content-body">
                <div class="table-toolbar">
                    <div>
                        <h1 style="font-size: var(--text-2xl);">Đối soát Giao dịch</h1>
                        <p style="font-size: var(--text-xs);">Theo dõi toàn bộ giao dịch qua cổng VietQR SePay và VNPay.</p>
                    </div>
                </div>

                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr><th>ID</th><th>Mã đơn</th><th>Mã GD</th><th>Cổng thanh toán</th><th>Số tiền</th><th>Trạng thái</th><th>Thời gian</th></tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="7" style="text-align: center; padding: 32px;">Đang tải...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div id="paginationBar" style="display: flex; justify-content: center; gap: 8px; margin-top: 20px;"></div>
            </main>
        </div>
    </div>

    <script type="module">
        import { api } from './assets/js/api.js';
        import { auth } from './assets/js/auth.js';
        import { CONFIG } from './assets/js/config.js';
        import { initAdminLayout } from './assets/js/admin-layout.js?v=6';

        function formatPrice(p) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(p || 0);
        }

        async function loadPayments(page = 0) {
            if (!auth.requireAdmin()) return;
            try {
                const data = await api.get(CONFIG.ENDPOINTS.PAYMENT.HISTORY, { page_no: page, page_size: 10, sortBy: 'id', sortDir: 'desc' });
                const items = data?.content || [];
                const totalPages = data?.totalPages || 1;
                const tbody = document.getElementById('tableBody');

                if (!items.length) {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:32px;">Chưa có giao dịch nào.</td></tr>`;
                    return;
                }

                tbody.innerHTML = items.map(p => `
                    <tr>
                        <td class="tabular-nums">#${p.id}</td>
                        <td class="tabular-nums">#${p.orderId}</td>
                        <td class="mono-spec" style="font-size: var(--text-xs);">${p.transactionId || '-'}</td>
                        <td><span class="badge badge-info">${p.paymentGateway}</span></td>
                        <td class="tabular-nums" style="font-weight: var(--font-semibold);">${formatPrice(p.amount)}</td>
                        <td>${p.status === 'SUCCESS' ? '<span class="badge badge-success">Thành công</span>' : '<span class="badge badge-danger">Thất bại</span>'}</td>
                        <td class="tabular-nums" style="font-size: var(--text-xs);">${p.createdAt ? new Date(p.createdAt).toLocaleString('vi-VN') : '-'}</td>
                    </tr>
                `).join('');

                const pag = document.getElementById('paginationBar');
                pag.innerHTML = totalPages > 1 ? Array.from({ length: totalPages }, (_, i) =>
                    `<button class="btn btn-sm ${i === page ? 'btn-primary' : 'btn-secondary'}" data-page="${i}">${i + 1}</button>`
                ).join('') : '';
                pag.querySelectorAll('button').forEach(b => b.addEventListener('click', () => loadPayments(Number(b.dataset.page))));
            } catch (err) {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="7" class="text-danger">${err.message}</td></tr>`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => { initAdminLayout({ active: 'payments', title: 'Lịch sử Giao dịch Thanh toán' }); loadPayments(0); });
    </script>
</body>
</html>
