<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết sản phẩm — HK COMPUTER</title>
    <link rel="stylesheet" href="./assets/css/base.css?v=6" />
    <link rel="stylesheet" href="./assets/css/components.css?v=6" />
    <style>
        .breadcrumb-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 20px 0 4px;
            font-size: var(--text-xs);
            color: var(--text-secondary);
        }

        .breadcrumb-bar a {
            color: var(--text-secondary);
            transition: color var(--transition-fast);
        }

        .breadcrumb-bar a:hover {
            color: var(--brand-green);
        }

        .breadcrumb-sep {
            color: var(--text-muted);
        }

        .breadcrumb-current {
            color: var(--text-primary);
            font-weight: 600;
            max-width: 360px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1.15fr;
            gap: 28px;
            margin: 18px 0 40px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .product-detail-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Left visual column */
        .detail-media-col {
            position: sticky;
            top: calc(var(--header-height) + 20px);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        @media (max-width: 900px) {
            .detail-media-col {
                position: static;
            }
        }

        .detail-image-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            position: relative;
        }

        .detail-image-card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 320ms var(--ease-out);
        }

        .detail-image-card:hover img {
            transform: scale(1.04);
        }

        .media-highlights {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        @media (max-width: 520px) {
            .media-highlights {
                grid-template-columns: 1fr;
            }
        }

        .media-highlight-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 10px;
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.35;
        }

        .media-highlight-icon {
            width: 30px;
            height: 30px;
            border-radius: var(--radius-sm);
            background: var(--brand-green-soft);
            color: var(--brand-green);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Right buy box */
        .detail-buy-card {
            padding: 28px;
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        @media (max-width: 560px) {
            .detail-buy-card {
                padding: 20px;
            }
        }

        .detail-meta-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .detail-title {
            font-size: clamp(1.35rem, 2.2vw, 1.75rem);
            line-height: 1.28;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin: 0;
        }

        .price-banner {
            background: var(--surface-subtle);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .price-main {
            font-family: var(--font-mono);
            font-size: clamp(1.45rem, 2.4vw, 1.85rem);
            font-weight: 800;
            color: var(--brand-orange);
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        .price-sub {
            font-size: var(--text-xs);
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .specs-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .specs-header {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: var(--text-xs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-primary);
            padding: 12px 16px;
            background: var(--surface-subtle);
            border-bottom: 1px solid var(--border);
        }

        .spec-table {
            width: 100%;
            border-collapse: collapse;
            font-size: var(--text-xs);
        }

        .spec-table tr:nth-child(even) {
            background: var(--surface-subtle);
        }

        .spec-table td {
            padding: 9px 16px;
            border-bottom: 1px solid var(--border-subtle);
            color: var(--text-primary);
            line-height: 1.45;
        }

        .spec-table tr:last-child td {
            border-bottom: none;
        }

        .spec-table td.spec-key {
            width: 34%;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .spec-table td.spec-val {
            font-family: var(--font-mono);
        }

        .perks-box {
            background: var(--surface-subtle);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px 16px;
        }

        .perks-box-title {
            font-size: var(--text-xs);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .perks-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: var(--text-xs);
            color: var(--text-secondary);
        }

        .perks-list li {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .perks-check {
            color: var(--brand-green);
            font-weight: 700;
            flex-shrink: 0;
        }

        .detail-description {
            font-size: var(--text-sm);
            color: var(--text-secondary);
            line-height: 1.65;
            margin: 0;
        }

        /* Quantity + Action Bar */
        .buy-actions-section {
            padding-top: 18px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .qty-row {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .qty-label {
            font-size: var(--text-sm);
            font-weight: 600;
            color: var(--text-primary);
        }

        .qty-control {
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: var(--surface);
        }

        .qty-control button {
            width: 38px;
            height: 38px;
            background: var(--surface-subtle);
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: var(--text-base);
            color: var(--text-primary);
            transition: background-color var(--transition-fast);
        }

        .qty-control button:hover {
            background: var(--surface-hover);
        }

        .qty-control input {
            width: 52px;
            height: 38px;
            border: none;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            text-align: center;
            font-family: var(--font-mono);
            font-size: var(--text-sm);
            font-weight: 600;
            color: var(--text-primary);
            background: var(--surface);
            outline: none;
        }

        .cta-btn-row {
            display: grid;
            grid-template-columns: 1fr 1.25fr;
            gap: 12px;
        }

        @media (max-width: 520px) {
            .cta-btn-row {
                grid-template-columns: 1fr;
            }
        }

        .cta-btn-row .btn-lg {
            height: 48px;
            font-size: var(--text-sm);
            font-weight: 700;
            border-radius: var(--radius-md);
        }

        .btn-cart-outline {
            background: var(--brand-orange-soft);
            color: var(--brand-orange);
            border: 1px solid var(--brand-orange);
        }

        .btn-cart-outline:hover:not(:disabled) {
            background: var(--brand-orange);
            color: #FFFFFF;
            border-color: var(--brand-orange);
        }

        .out-of-stock-notice {
            padding: 14px 16px;
            border-radius: var(--radius-md);
            background: var(--surface-subtle);
            border: 1px solid var(--border);
            font-size: var(--text-sm);
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Reviews */
        .review-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px;
            margin-bottom: 64px;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .review-summary-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: var(--radius-pill);
            background: var(--surface-subtle);
            border: 1px solid var(--border);
            font-size: var(--text-xs);
            font-weight: 600;
            color: var(--text-primary);
        }

        .review-item {
            padding: 16px 0;
            border-bottom: 1px solid var(--border-subtle);
        }

        .review-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .review-stars {
            color: #F59E0B;
            font-size: 14px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <header id="appHeader"></header>

    <main class="container">
        <nav class="breadcrumb-bar" aria-label="Breadcrumb">
            <a href="index.html">Trang chủ</a>
            <span class="breadcrumb-sep">/</span>
            <a href="index.html#catalog">Danh mục sản phẩm</a>
            <span class="breadcrumb-sep">/</span>
            <span id="breadcrumbProductName" class="breadcrumb-current">Chi tiết sản phẩm</span>
        </nav>

        <div id="productDetailContainer">
            <div class="card" style="text-align: center; padding: 56px 24px; margin: 20px 0 40px;">
                <p style="color: var(--text-secondary);">Đang tải thông tin sản phẩm...</p>
            </div>
        </div>

        <section id="reviewSection" class="review-card" style="display: none;">
            <div class="review-header">
                <h2 style="font-size: var(--text-xl); margin: 0;">Đánh giá từ khách hàng</h2>
                <div id="reviewSummary" class="review-summary-pill tabular-nums"></div>
            </div>
            <div id="reviewList"></div>
            <div id="reviewPagination" style="display: flex; gap: 8px; justify-content: center; margin-top: 18px;"></div>
        </section>
    </main>

    <footer id="appFooter"></footer>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script type="module">
        import { api } from './assets/js/api.js';
        import { auth } from './assets/js/auth.js';
        import { cart } from './assets/js/cart.js?v=7';
        import { CONFIG } from './assets/js/config.js';
        import { initStoreLayout } from './assets/js/layout.js?v=7';
        import { toast } from './assets/js/toast.js';
        import './assets/js/chat-widget.js?v=6';

        const productId = new URLSearchParams(window.location.search).get('id');
        const detailContainer = document.getElementById('productDetailContainer');
        const breadcrumbProductName = document.getElementById('breadcrumbProductName');
        let currentStock = 0;
        let currentProduct = null;

        function formatPrice(p) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(p || 0);
        }

        function renderSpecsHtml(rawSpecs) {
            if (!rawSpecs) return '';
            const parts = String(rawSpecs)
                .split(/[|,;\n]+/)
                .map(s => s.trim())
                .filter(Boolean);

            const defaultLabels = ['Vi xử lý (CPU)', 'Bộ nhớ RAM', 'Ổ cứng lưu trữ', 'Card đồ họa (VGA)', 'Màn hình', 'Pin & Nguồn', 'Kết nối & Khác'];
            const rowsHtml = parts.map((part, idx) => {
                const colonIdx = part.indexOf(':');
                if (colonIdx > 0 && colonIdx < 28) {
                    const k = part.slice(0, colonIdx).trim();
                    const v = part.slice(colonIdx + 1).trim();
                    return `<tr><td class="spec-key">${k}</td><td class="spec-val">${v}</td></tr>`;
                }
                const label = parts.length > 1 ? (defaultLabels[idx] || `Thông số #${idx + 1}`) : 'Cấu hình tiêu chuẩn';
                return `<tr><td class="spec-key">${label}</td><td class="spec-val">${part}</td></tr>`;
            }).join('');

            return `
                <div class="specs-box">
                    <div class="specs-header">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg>
                        <span>Bảng thông số kỹ thuật</span>
                    </div>
                    <table class="spec-table"><tbody>${rowsHtml}</tbody></table>
                </div>
            `;
        }

        async function loadDetail() {
            if (!productId) {
                detailContainer.innerHTML = `<div class="card" style="padding: 40px; text-align:center; margin-top: 24px;"><p class="text-danger">Thiếu ID sản phẩm.</p></div>`;
                return;
            }

            try {
                const [product, inv] = await Promise.all([
                    api.get(CONFIG.ENDPOINTS.PRODUCTS.DETAIL(productId)),
                    api.get(CONFIG.ENDPOINTS.INVENTORY.USER_DETAIL(productId)).catch(() => null)
                ]);

                currentProduct = product;
                currentStock = inv?.soluong ?? 0;
                const img = product.image || 'https://images.unsplash.com/photo-1587202372775-e229f172b9d7?w=600&q=80';
                const inStock = currentStock > 0;
                const safeTitle = (product.nameProduct || 'Sản phẩm').replace(/"/g, '&quot;');

                document.title = `${product.nameProduct || 'Chi tiết sản phẩm'} — HK COMPUTER`;
                if (breadcrumbProductName) breadcrumbProductName.textContent = product.nameProduct || 'Chi tiết sản phẩm';

                detailContainer.innerHTML = `
                    <div class="product-detail-grid">
                        <!-- Left: Visual Showcase & Quick Highlights -->
                        <div class="detail-media-col">
                            <div class="detail-image-card">
                                <img src="${img}" alt="${safeTitle}" />
                            </div>

                            <div class="media-highlights">
                                <div class="media-highlight-item">
                                    <span class="media-highlight-icon">
                                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                                    </span>
                                    <span>Bảo hành điện tử 12–36 tháng</span>
                                </div>
                                <div class="media-highlight-item">
                                    <span class="media-highlight-icon">
                                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
                                    </span>
                                    <span>Chuyển khoản VietQR &amp; thẻ ATM</span>
                                </div>
                                <div class="media-highlight-item">
                                    <span class="media-highlight-icon">
                                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
                                    </span>
                                    <span>Hỗ trợ cài đặt &amp; nâng cấp</span>
                                </div>
                            </div>
                        </div>

                        <!-- Right: Buy Box -->
                        <div class="card detail-buy-card">
                            <div class="detail-meta-row">
                                <span class="badge badge-info">SKU #${product.id}</span>
                                <span id="stockBadge" class="badge ${inStock ? 'badge-success' : 'badge-danger'}">
                                    ${inStock ? `Còn ${currentStock} sản phẩm` : 'Tạm hết hàng'}
                                </span>
                            </div>

                            <h1 class="detail-title">${product.nameProduct}</h1>

                            <div class="price-banner">
                                <div>
                                    <div class="price-main tabular-nums">${formatPrice(product.price)}</div>
                                    <div class="price-sub">Đã bao gồm VAT · Xuất hóa đơn điện tử</div>
                                </div>
                                <span class="badge badge-success">Chính hãng 100%</span>
                            </div>

                            ${renderSpecsHtml(product.specs)}

                            ${product.description ? `
                                <p class="detail-description">${product.description}</p>
                            ` : ''}

                            <div class="perks-box">
                                <div class="perks-box-title">Quyền lợi &amp; Dịch vụ đi kèm tại HK COMPUTER</div>
                                <ul class="perks-list">
                                    <li><span class="perks-check">✓</span><span>Kích hoạt bảo hành điện tử chính hãng 12–36 tháng theo mã đơn hàng</span></li>
                                    <li><span class="perks-check">✓</span><span>Miễn phí công lắp đặt khi nâng cấp thêm RAM hoặc ổ cứng SSD tại 10 chi nhánh</span></li>
                                    <li><span class="perks-check">✓</span><span>Giảm 20.000đ dịch vụ vệ sinh, tra keo tản nhiệt khi đặt lịch hẹn trước</span></li>
                                </ul>
                            </div>

                            <div class="buy-actions-section">
                                <div id="buyControlsWrap" style="display: ${inStock ? 'flex' : 'none'}; flex-direction: column; gap: 14px;">
                                    <div class="qty-row">
                                        <span class="qty-label">Số lượng</span>
                                        <div class="qty-control">
                                            <button type="button" id="btnQtyDec" aria-label="Giảm số lượng">−</button>
                                            <input type="number" id="qtyInput" value="1" min="1" max="${currentStock > 0 ? currentStock : 99}" />
                                            <button type="button" id="btnQtyInc" aria-label="Tăng số lượng">+</button>
                                        </div>
                                        <span id="stockHint" style="font-size: var(--text-xs); color: var(--text-muted);" class="tabular-nums">
                                            ${inStock ? `${currentStock} sản phẩm có sẵn` : ''}
                                        </span>
                                    </div>

                                    <div class="cta-btn-row">
                                        <button type="button" id="btnAddToCart" class="btn btn-cart-outline btn-lg">
                                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                                            <span>Thêm vào giỏ</span>
                                        </button>
                                        <button type="button" id="btnBuyNow" class="btn btn-primary btn-lg">
                                            <span>Mua ngay</span>
                                        </button>
                                    </div>
                                </div>

                                <div id="outOfStockNotice" class="out-of-stock-notice" style="display: ${inStock ? 'none' : 'block'};">
                                    Sản phẩm hiện tạm hết hàng. Bạn vẫn có thể xem đầy đủ thông số kỹ thuật bên trên hoặc liên hệ cửa hàng để được tư vấn mẫu tương đương.
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                bindDetailEvents();
                if (inv?.id) connectInventoryWs(inv.id);
                loadReviews(0);
            } catch (err) {
                detailContainer.innerHTML = `<div class="card" style="padding: 40px; text-align:center; margin-top: 24px;"><p class="text-danger">${err.message}</p></div>`;
            }
        }

        function bindDetailEvents() {
            const qtyInput = document.getElementById('qtyInput');
            const getQty = () => {
                const max = currentStock > 0 ? currentStock : 99;
                const val = Math.max(1, Math.min(max, parseInt(qtyInput.value) || 1));
                qtyInput.value = val;
                return val;
            };

            document.getElementById('btnQtyDec')?.addEventListener('click', () => {
                const v = getQty();
                if (v > 1) qtyInput.value = v - 1;
            });

            document.getElementById('btnQtyInc')?.addEventListener('click', () => {
                const v = getQty();
                const max = currentStock > 0 ? currentStock : 99;
                if (v < max) qtyInput.value = v + 1;
            });

            document.getElementById('btnBuyNow')?.addEventListener('click', () => {
                const qty = getQty();
                cart.buyNow({
                    id: currentProduct.id,
                    name: currentProduct.nameProduct,
                    price: currentProduct.price,
                    image: currentProduct.image
                }, qty);
            });

            document.getElementById('btnAddToCart')?.addEventListener('click', async () => {
                const qty = getQty();
                await cart.addItem({
                    id: currentProduct.id,
                    name: currentProduct.nameProduct,
                    price: currentProduct.price,
                    image: currentProduct.image
                }, qty);
            });
        }

        function connectInventoryWs(inventoryId) {
            try {
                if (typeof SockJS === 'undefined' || typeof Stomp === 'undefined') return;
                const socket = new SockJS(`${CONFIG.API_BASE_URL}/ws`);
                const client = Stomp.over(socket);
                client.debug = () => {};
                client.connect({}, () => {
                    client.subscribe(`/topic/inventory/${inventoryId}`, (msg) => {
                        try {
                            const data = JSON.parse(msg.body);
                            if (data.stockQuantity !== undefined) {
                                currentStock = data.stockQuantity;
                                const inStock = currentStock > 0;
                                const badge = document.getElementById('stockBadge');
                                const stockHint = document.getElementById('stockHint');
                                const buyControlsWrap = document.getElementById('buyControlsWrap');
                                const outOfStockNotice = document.getElementById('outOfStockNotice');
                                const qtyInput = document.getElementById('qtyInput');

                                if (badge) {
                                    badge.className = `badge ${inStock ? 'badge-success' : 'badge-danger'}`;
                                    badge.textContent = inStock ? `Còn ${currentStock} sản phẩm` : 'Tạm hết hàng';
                                }
                                if (stockHint) {
                                    stockHint.textContent = inStock ? `${currentStock} sản phẩm có sẵn` : '';
                                }
                                if (qtyInput && inStock) {
                                    qtyInput.max = currentStock;
                                }
                                if (buyControlsWrap) {
                                    buyControlsWrap.style.display = inStock ? 'flex' : 'none';
                                }
                                if (outOfStockNotice) {
                                    outOfStockNotice.style.display = inStock ? 'none' : 'block';
                                }
                                toast.info(`Cập nhật tồn kho mới nhất: còn ${currentStock} sản phẩm.`);
                            }
                        } catch (_) {}
                    });
                });
            } catch (_) {}
        }

        async function loadReviews(page = 0) {
            try {
                const data = await api.get(CONFIG.ENDPOINTS.REVIEW.LIST_BY_PRODUCT(productId), { page, size: 5 });
                const items = data?.content || [];
                const totalPages = data?.totalPages || 0;
                const reviewSection = document.getElementById('reviewSection');
                reviewSection.style.display = 'block';

                if (!items.length) {
                    document.getElementById('reviewSummary').textContent = 'Chưa có đánh giá';
                    document.getElementById('reviewList').innerHTML = `<p style="font-size: var(--text-sm); color: var(--text-secondary);">Chưa có đánh giá nào cho sản phẩm này.</p>`;
                    return;
                }

                const avg = (items.reduce((s, r) => s + r.rating, 0) / items.length).toFixed(1);
                document.getElementById('reviewSummary').innerHTML = `<span class="review-stars">★</span> ${avg} / 5 (${data.totalElements || items.length} đánh giá)`;
                document.getElementById('reviewList').innerHTML = items.map(r => `
                    <div class="review-item">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                            <span class="review-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
                            <span style="font-size: var(--text-xs); color: var(--text-muted);" class="tabular-nums">${new Date(r.createdAt).toLocaleDateString('vi-VN')}</span>
                        </div>
                        <p style="font-size: var(--text-sm); color: var(--text-primary); margin: 0; line-height: 1.55;">${r.comment || 'Không có bình luận'}</p>
                    </div>
                `).join('');

                const pag = document.getElementById('reviewPagination');
                if (totalPages > 1) {
                    let html = '';
                    for (let i = 0; i < totalPages; i++) {
                        html += `<button class="btn btn-sm ${i === page ? 'btn-primary' : 'btn-secondary'}" data-page="${i}">${i + 1}</button>`;
                    }
                    pag.innerHTML = html;
                    pag.querySelectorAll('button').forEach(b => b.addEventListener('click', () => loadReviews(Number(b.dataset.page))));
                } else {
                    pag.innerHTML = '';
                }
            } catch (_) {}
        }

        document.addEventListener('DOMContentLoaded', () => {
            initStoreLayout({ activeNav: 'home' });
            cart.updateHeaderBadge();
            loadDetail();
        });
    </script>
</body>
</html>
