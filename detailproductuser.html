<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết sản phẩm — HK COMPUTER</title>
    <link rel="stylesheet" href="./assets/css/base.css?v=6" />
    <link rel="stylesheet" href="./assets/css/components.css?v=6" />
    <style>
        .product-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 32px;
            margin: 32px 0 48px;
        }

        @media (max-width: 860px) {
            .product-detail-grid {
                grid-template-columns: 1fr;
            }
        }

        .detail-image-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 360px;
        }

        .detail-image-card img {
            max-width: 100%;
            max-height: 380px;
            object-fit: contain;
        }

        .specs-box {
            background: var(--surface-subtle);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
            font-size: var(--text-sm);
            margin: 16px 0;
        }

        .qty-control {
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: var(--surface);
        }

        .qty-control button {
            width: 38px;
            height: 40px;
            background: var(--surface-subtle);
            border: none;
            cursor: pointer;
            font-weight: var(--font-semibold);
            font-size: var(--text-base);
        }

        .qty-control input {
            width: 52px;
            height: 40px;
            border: none;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            text-align: center;
            font-family: var(--font-mono);
            font-size: var(--text-sm);
            outline: none;
        }

        .review-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 28px;
            margin-bottom: 64px;
        }

        .review-item {
            padding: 16px 0;
            border-bottom: 1px solid var(--border-subtle);
        }

        .review-item:last-child {
            border-bottom: none;
        }




    </style>
</head>
<body>
    <header id="appHeader"></header>

    <main class="container">
        <div style="padding-top: 24px;">
            <a href="index.html" style="font-size: var(--text-xs); color: var(--text-secondary);">← Quay lại danh sách sản phẩm</a>
        </div>

        <div id="productDetailContainer">
            <div class="card" style="text-align: center; padding: 48px; margin-top: 24px;">
                <p>Đang tải thông tin sản phẩm...</p>
            </div>
        </div>

        <div id="reviewSection" class="review-card" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 16px;">
                <h2 style="font-size: var(--text-xl);">Đánh giá từ khách hàng</h2>
                <div id="reviewSummary" class="tabular-nums" style="font-size: var(--text-sm); font-weight: var(--font-semibold);"></div>
            </div>
            <div id="reviewList"></div>
            <div id="reviewPagination" style="display: flex; gap: 8px; justify-content: center; margin-top: 16px;"></div>
        </div>
    </main>

    <footer id="appFooter"></footer>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script type="module">
        import { api } from './assets/js/api.js';
        import { auth } from './assets/js/auth.js';
        import { cart } from './assets/js/cart.js';
        import { CONFIG } from './assets/js/config.js';
        import { initStoreLayout } from './assets/js/layout.js?v=6';
        import { toast } from './assets/js/toast.js';
        import './assets/js/chat-widget.js?v=6';

        const productId = new URLSearchParams(window.location.search).get('id');
        const detailContainer = document.getElementById('productDetailContainer');
        let currentStock = 0;
        let currentProduct = null;

        function formatPrice(p) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(p || 0);
        }

        async function loadDetail() {
            if (!productId) {
                detailContainer.innerHTML = `<div class="card" style="padding: 40px; text-align:center; margin-top: 24px;"><p class="text-danger">Thiếu ID sản phẩm.</p></div>`;
                return;
            }

            try {
                const [product, inv] = await Promise.all([
                    api.get(CONFIG.ENDPOINTS.PRODUCTS.DETAIL(productId)),
                    api.get(CONFIG.ENDPOINTS.INVENTORY.USER_DETAIL(productId)).catch(() => null)
                ]);

                currentProduct = product;
                currentStock = inv?.soluong ?? null;
                const img = product.image || 'https://images.unsplash.com/photo-1587202372775-e229f172b9d7?w=600&q=80';
                const inStock = currentStock === null || currentStock > 0;

                detailContainer.innerHTML = `
                    <div class="product-detail-grid">
                        <div class="detail-image-card">
                            <img src="${img}" alt="${product.nameProduct}" />
                        </div>

                        <div class="card" style="display: flex; flex-direction: column; justify-content: space-between;">
                            <div>
                                <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 10px;">
                                    <span class="badge badge-info">SKU #${product.id}</span>
                                    <span id="stockBadge" class="badge ${inStock ? 'badge-success' : 'badge-danger'}">
                                        ${currentStock === null ? 'Sẵn sàng đặt hàng' : (currentStock > 0 ? `Còn ${currentStock} sản phẩm` : 'Tạm hết hàng')}
                                    </span>
                                </div>

                                <h1 style="font-size: var(--text-2xl); margin-bottom: 12px;">${product.nameProduct}</h1>
                                <div class="tabular-nums" style="font-size: var(--text-2xl); font-weight: var(--font-bold); margin-bottom: 16px;">
                                    ${formatPrice(product.price)}
                                </div>

                                ${product.specs ? `
                                    <div class="specs-box">
                                        <div style="font-size: var(--text-xs); text-transform: uppercase; color: var(--text-secondary); margin-bottom: 4px; font-weight: var(--font-semibold);">Thông số kỹ thuật</div>
                                        <div class="mono-spec" style="font-size: var(--text-xs);">${product.specs}</div>
                                    </div>
                                ` : ''}

                                ${product.description ? `
                                    <p style="font-size: var(--text-sm); margin-bottom: 20px;">${product.description}</p>
                                ` : ''}
                            </div>

                            <div>
                                <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding-top: 16px; border-top: 1px solid var(--border);">
                                    <div class="qty-control">
                                        <button type="button" id="btnQtyDec">−</button>
                                        <input type="number" id="qtyInput" value="1" min="1" max="${currentStock > 0 ? currentStock : 99}" />
                                        <button type="button" id="btnQtyInc">+</button>
                                    </div>
                                    <button type="button" id="btnAddToCart" class="btn btn-primary btn-lg" style="flex: 1;" ${!inStock ? 'disabled' : ''}>
                                        ${inStock ? 'Thêm vào giỏ hàng' : 'Hết hàng'}
                                    </button>
                                </div>
                                <p style="font-size: var(--text-xs); color: var(--text-secondary); margin-top: 12px;">
                                    🛡️ Bảo hành điện tử chính hãng 12 - 36 tháng • Hỗ trợ thanh toán VietQR SePay & VNPay
                                </p>
                            </div>
                        </div>
                    </div>
                `;

                bindDetailEvents();
                if (inv?.id) connectInventoryWs(inv.id);
                loadReviews(0);
            } catch (err) {
                detailContainer.innerHTML = `<div class="card" style="padding: 40px; text-align:center; margin-top: 24px;"><p class="text-danger">${err.message}</p></div>`;
            }
        }

        function bindDetailEvents() {
            const qtyInput = document.getElementById('qtyInput');
            document.getElementById('btnQtyDec')?.addEventListener('click', () => {
                let v = parseInt(qtyInput.value) || 1;
                if (v > 1) qtyInput.value = v - 1;
            });
            document.getElementById('btnQtyInc')?.addEventListener('click', () => {
                let v = parseInt(qtyInput.value) || 1;
                const max = currentStock > 0 ? currentStock : 99;
                if (v < max) qtyInput.value = v + 1;
            });
            document.getElementById('btnAddToCart')?.addEventListener('click', async () => {
                const qty = parseInt(qtyInput.value) || 1;
                await cart.addItem({
                    id: currentProduct.id,
                    name: currentProduct.nameProduct,
                    price: currentProduct.price,
                    image: currentProduct.image
                }, qty);
            });
        }

        function connectInventoryWs(inventoryId) {
            try {
                if (typeof SockJS === 'undefined' || typeof Stomp === 'undefined') return;
                const socket = new SockJS(`${CONFIG.API_BASE_URL}/ws`);
                const client = Stomp.over(socket);
                client.debug = () => {};
                client.connect({}, () => {
                    client.subscribe(`/topic/inventory/${inventoryId}`, (msg) => {
                        try {
                            const data = JSON.parse(msg.body);
                            if (data.stockQuantity !== undefined) {
                                currentStock = data.stockQuantity;
                                const badge = document.getElementById('stockBadge');
                                const btn = document.getElementById('btnAddToCart');
                                if (badge) {
                                    badge.className = `badge ${currentStock > 0 ? 'badge-success' : 'badge-danger'}`;
                                    badge.textContent = currentStock > 0 ? `Còn ${currentStock} sản phẩm` : 'Tạm hết hàng';
                                }
                                if (btn) {
                                    btn.disabled = currentStock <= 0;
                                    btn.textContent = currentStock > 0 ? 'Thêm vào giỏ hàng' : 'Hết hàng';
                                }
                                toast.info(`Cập nhật tồn kho mới nhất: còn ${currentStock} sản phẩm.`);
                            }
                        } catch (_) {}
                    });
                });
            } catch (_) {}
        }

        async function loadReviews(page = 0) {
            try {
                const data = await api.get(CONFIG.ENDPOINTS.REVIEW.LIST_BY_PRODUCT(productId), { page, size: 5 });
                const items = data?.content || [];
                const totalPages = data?.totalPages || 0;
                const reviewSection = document.getElementById('reviewSection');
                reviewSection.style.display = 'block';

                if (!items.length) {
                    document.getElementById('reviewSummary').textContent = 'Chưa có đánh giá';
                    document.getElementById('reviewList').innerHTML = `<p style="font-size: var(--text-sm);">Chưa có đánh giá nào cho sản phẩm này.</p>`;
                    return;
                }

                const avg = (items.reduce((s, r) => s + r.rating, 0) / items.length).toFixed(1);
                document.getElementById('reviewSummary').textContent = `⭐ ${avg} / 5 (${data.totalElements || items.length} đánh giá)`;
                document.getElementById('reviewList').innerHTML = items.map(r => `
                    <div class="review-item">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                            <span style="color: #D97706; font-weight: var(--font-semibold);">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
                            <span style="font-size: var(--text-xs); color: var(--text-secondary);">${new Date(r.createdAt).toLocaleDateString('vi-VN')}</span>
                        </div>
                        <p style="font-size: var(--text-sm); color: var(--text-primary);">${r.comment || 'Không có bình luận'}</p>
                    </div>
                `).join('');

                const pag = document.getElementById('reviewPagination');
                if (totalPages > 1) {
                    let html = '';
                    for (let i = 0; i < totalPages; i++) {
                        html += `<button class="btn btn-sm ${i === page ? 'btn-primary' : 'btn-secondary'}" data-page="${i}">${i + 1}</button>`;
                    }
                    pag.innerHTML = html;
                    pag.querySelectorAll('button').forEach(b => b.addEventListener('click', () => loadReviews(Number(b.dataset.page))));
                } else {
                    pag.innerHTML = '';
                }
            } catch (_) {}
        }

        document.addEventListener('DOMContentLoaded', () => {
            initStoreLayout({ activeNav: 'home' });
            cart.updateHeaderBadge();
            loadDetail();
        });
    </script>
</body>
</html>
