<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xác thực OTP — Hoang89 Computer</title>
    <link rel="stylesheet" href="./assets/css/base.css" />
    <link rel="stylesheet" href="./assets/css/components.css" />
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 24px;
            background-color: var(--canvas);
        }
        .auth-container { width: 100%; max-width: 400px; }
        .auth-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px;
        }
        .otp-input {
            text-align: center;
            font-size: var(--text-2xl);
            letter-spacing: 0.35em;
            font-family: var(--font-mono);
            font-weight: var(--font-semibold);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 24px;">
                <a href="index.html" style="font-size: var(--text-xs); font-weight: var(--font-semibold); text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary);">Hoang89 Computer</a>
                <h1 style="font-size: var(--text-2xl); margin: 8px 0 6px;">Xác thực tài khoản</h1>
                <p style="font-size: var(--text-xs); color: var(--text-secondary);">
                    Nhập mã OTP gồm 6 chữ số đã gửi tới <b id="targetEmailDisplay" style="color: var(--text-primary);">email của bạn</b>
                </p>
            </div>

            <form id="otpForm">
                <div class="form-group">
                    <label class="form-label" for="gmailInput">Gmail xác thực</label>
                    <input type="email" id="gmailInput" class="input" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="otpCode">Mã xác nhận (OTP)</label>
                    <input type="text" id="otpCode" class="input otp-input" placeholder="000000" maxlength="6" required />
                </div>

                <button type="submit" id="btnVerify" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
                    Xác thực & Kích hoạt
                </button>
            </form>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; font-size: var(--text-xs);">
                <button type="button" id="btnResendOtp" class="btn btn-outline btn-sm">Gửi lại mã OTP</button>
                <a href="dang-nhap.html" style="text-decoration: underline;">Quay lại đăng nhập</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { api, setAccessToken } from './assets/js/api.js';
        import { CONFIG } from './assets/js/config.js';
        import { toast } from './assets/js/toast.js';

        const urlParams = new URLSearchParams(window.location.search);
        const initialGmail = urlParams.get('gmail') || sessionStorage.getItem('pendingVerifyGmail') || '';

        const gmailInput = document.getElementById('gmailInput');
        const targetEmailDisplay = document.getElementById('targetEmailDisplay');
        const otpForm = document.getElementById('otpForm');
        const btnVerify = document.getElementById('btnVerify');
        const btnResendOtp = document.getElementById('btnResendOtp');

        if (initialGmail) {
            gmailInput.value = initialGmail;
            targetEmailDisplay.textContent = initialGmail;
        }

        otpForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const gmail = gmailInput.value.trim();
            const code = document.getElementById('otpCode').value.trim();

            btnVerify.disabled = true;
            btnVerify.textContent = 'Đang kiểm tra...';

            try {
                const account = await api.post(`${CONFIG.ENDPOINTS.AUTH.CHECK_OTP}?gmail=${encodeURIComponent(gmail)}&code=${encodeURIComponent(code)}`);
                if (account) {
                    sessionStorage.setItem('accountInfo', JSON.stringify(account));
                    sessionStorage.removeItem('pendingVerifyGmail');
                }
                toast.success('Xác thực tài khoản thành công!');
                setTimeout(() => {
                    window.location.href = CONFIG.ROUTES.HOME;
                }, 800);
            } catch (err) {
                toast.error(err.message || 'Mã OTP không chính xác hoặc đã hết hạn.');
                btnVerify.disabled = false;
                btnVerify.textContent = 'Xác thực & Kích hoạt';
            }
        });

        btnResendOtp.addEventListener('click', async () => {
            const gmail = gmailInput.value.trim();
            if (!gmail) {
                toast.warning('Vui lòng nhập Gmail.');
                return;
            }
            btnResendOtp.disabled = true;
            try {
                await api.post(`${CONFIG.ENDPOINTS.AUTH.SEND_OTP}?gmail=${encodeURIComponent(gmail)}`);
                toast.success('Đã gửi lại mã OTP mới.');
            } catch (err) {
                toast.error(err.message || 'Không thể gửi lại mã.');
            } finally {
                setTimeout(() => { btnResendOtp.disabled = false; }, 15000);
            }
        });
    </script>
</body>
</html>
