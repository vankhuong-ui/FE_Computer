<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đánh giá sản phẩm — HK COMPUTER</title>
    <link rel="stylesheet" href="./assets/css/base.css?v=6" />
    <link rel="stylesheet" href="./assets/css/components.css?v=6" />
    <style>
        .review-container {
            max-width: 560px;
            margin: 48px auto;
            padding: 0 20px;
        }
        .star-picker {
            display: flex;
            gap: 8px;
            font-size: 28px;
            cursor: pointer;
            margin-top: 4px;
        }
        .star-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--border-hover);
            transition: transform var(--transition-fast);
        }
        .star-btn.active {
            color: #D97706;
        }
    </style>
</head>
<body>
    <header id="appHeader"></header>

    <main class="review-container">
        <div class="card">
            <h1 style="font-size: var(--text-xl); margin-bottom: 6px;">Đánh giá sản phẩm đã mua</h1>
            <p style="font-size: var(--text-xs); margin-bottom: 20px;" id="productMeta">Đang tải thông tin sản phẩm...</p>

            <form id="reviewForm">
                <div class="form-group">
                    <label class="form-label">Mức độ hài lòng</label>
                    <div class="star-picker" id="starPicker">
                        <button type="button" class="star-btn active" data-val="1">★</button>
                        <button type="button" class="star-btn active" data-val="2">★</button>
                        <button type="button" class="star-btn active" data-val="3">★</button>
                        <button type="button" class="star-btn active" data-val="4">★</button>
                        <button type="button" class="star-btn active" data-val="5">★</button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="comment">Nhận xét thực tế của bạn</label>
                    <textarea id="comment" class="textarea" rows="4" required></textarea>
                </div>

                <div style="display: flex; gap: 10px;">
                    <a href="order.html" class="btn btn-secondary" style="flex: 1;">Quay lại đơn hàng</a>
                    <button type="submit" id="btnSubmit" class="btn btn-primary" style="flex: 1.4;">
                        Gửi đánh giá
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer id="appFooter"></footer>

    <script type="module">
        import { api } from './assets/js/api.js';
        import { auth } from './assets/js/auth.js';
        import { CONFIG } from './assets/js/config.js';
        import { toast } from './assets/js/toast.js';
        import { initStoreLayout } from './assets/js/layout.js?v=7';

        const params = new URLSearchParams(window.location.search);
        const orderId = Number(params.get('orderId'));
        const productId = Number(params.get('productId'));
        let rating = 5;

        document.querySelectorAll('.star-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                rating = Number(btn.dataset.val);
                document.querySelectorAll('.star-btn').forEach(b => {
                    b.classList.toggle('active', Number(b.dataset.val) <= rating);
                });
            });
        });

        async function init() {
            if (!auth.requireAuth()) return;
            if (!orderId || !productId) {
                toast.error('Thiếu thông tin đơn hàng hoặc sản phẩm.');
                return;
            }
            try {
                const product = await api.get(CONFIG.ENDPOINTS.PRODUCTS.DETAIL(productId));
                document.getElementById('productMeta').textContent = `Đơn hàng #${orderId} — ${product.nameProduct}`;
            } catch (_) {
                document.getElementById('productMeta').textContent = `Đơn hàng #${orderId} — Sản phẩm #${productId}`;
            }
        }

        document.getElementById('reviewForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.textContent = 'Đang gửi...';
            try {
                await api.post(CONFIG.ENDPOINTS.REVIEW.CREATE, {
                    orderId,
                    productId,
                    rating,
                    comment: document.getElementById('comment').value.trim()
                });
                toast.success('Cảm ơn bạn đã gửi đánh giá!');
                setTimeout(() => { window.location.href = CONFIG.ROUTES.ORDERS; }, 900);
            } catch (err) {
                toast.error(err.message || 'Không thể gửi đánh giá.');
                btn.disabled = false;
                btn.textContent = 'Gửi đánh giá';
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            initStoreLayout({ activeNav: '' });
            init();
        });
    </script>
</body>
</html>
