<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanh toán đơn hàng — HK COMPUTER</title>
    <link rel="stylesheet" href="./assets/css/base.css?v=8" />
    <link rel="stylesheet" href="./assets/css/components.css?v=8" />
    <style>
        .page-header {
            padding: 28px 0 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .checkout-grid {
            display: grid;
            grid-template-columns: 1.45fr 1fr;
            gap: 24px;
            margin-bottom: 64px;
            align-items: start;
        }

        @media (max-width: 860px) {
            .checkout-grid {
                grid-template-columns: 1fr;
            }
        }

        .fulfillment-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .fulfillment-tab {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--surface-subtle);
            cursor: pointer;
            text-align: left;
            transition: all 150ms ease;
        }

        .fulfillment-tab.active {
            border-color: var(--brand-green);
            background: var(--brand-green-soft);
        }

        .fulfillment-tab-title {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .fulfillment-tab-sub {
            font-size: 11.5px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .address-list, .pickup-branch-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 14px;
        }

        .pickup-branch-list {
            max-height: 290px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .address-option, .pickup-branch-option {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: border-color var(--transition-fast), background-color var(--transition-fast);
        }

        .address-option:hover, .pickup-branch-option:hover {
            border-color: #288AD6;
        }

        .address-option.selected, .pickup-branch-option.selected {
            border-color: var(--brand-green);
            background: var(--brand-green-soft);
        }

        .pickup-branch-option.disabled {
            opacity: 0.6;
        }

        .payment-methods {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
        }

        @media (max-width: 600px) {
            .payment-methods {
                grid-template-columns: 1fr;
            }
            .fulfillment-tabs {
                grid-template-columns: 1fr;
            }
        }

        .payment-method-card {
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px;
            cursor: pointer;
            background: var(--surface);
            transition: all var(--transition-fast);
        }

        .payment-method-card.selected {
            border-color: var(--brand-green);
            background: var(--brand-green-soft);
        }

        .payment-method-title {
            font-weight: var(--font-semibold);
            font-size: var(--text-sm);
            margin-bottom: 4px;
        }

        .payment-method-desc {
            font-size: var(--text-xs);
            color: var(--text-secondary);
        }

        .summary-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-subtle);
        }

        .summary-item img {
            width: 56px;
            height: 56px;
            object-fit: contain;
            background: var(--surface-subtle);
            border-radius: var(--radius-sm);
            padding: 4px;
            border: 1px solid var(--border);
        }

        .summary-total {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 16px;
            margin-top: 12px;
            border-top: 1px solid var(--border);
            font-weight: var(--font-semibold);
            font-size: var(--text-lg);
        }
    </style>
</head>
<body>
    <header id="appHeader"></header>

    <main class="container">
        <div class="page-header">
            <h1 style="font-size: var(--text-2xl);">Xác nhận đặt hàng &amp; Thanh toán</h1>
            <p style="font-size: var(--text-xs);">Chọn giao hàng tận nơi hoặc đến nhận trực tiếp tại cơ sở HK COMPUTER có sẵn hàng.</p>
        </div>

        <div id="checkoutContainer">
            <div class="card" style="text-align: center; padding: 48px;">
                <p>Đang chuẩn bị thông tin đơn hàng &amp; kiểm tra tồn kho tại các cơ sở...</p>
            </div>
        </div>
    </main>

    <footer id="appFooter"></footer>

    <script type="module">
        import { api } from './assets/js/api.js';
        import { auth } from './assets/js/auth.js';
        import { cart } from './assets/js/cart.js?v=7';
        import { CONFIG } from './assets/js/config.js';
        import { initStoreLayout } from './assets/js/layout.js?v=9';
        import { toast } from './assets/js/toast.js';
        import { formatPrice } from './assets/js/utils.js';

        const checkoutContainer = document.getElementById('checkoutContainer');
        let selectedItems = [];
        let addresses = [];
        let branches = [...CONFIG.BRANCHES];
        let productBranchStocksMap = new Map(); // productId -> Map(branchId -> soluong)

        let fulfillmentType = 'HOME_DELIVERY'; // HOME_DELIVERY | STORE_PICKUP
        let selectedAddressId = null;
        let selectedPickupBranchId = null;
        let selectedPickupCity = '';
        let receiverName = '';
        let receiverPhone = '';
        let selectedPaymentMethod = 'SEPAY'; // SEPAY, VNPAY, LATER

        function checkBranchCanFulfillAll(branchId) {
            for (const item of selectedItems) {
                const pId = Number(item.products?.id || item.id);
                const reqQty = Number(item.quality || item.quantity || 1);
                const branchMap = productBranchStocksMap.get(pId);
                if (branchMap) {
                    const avail = branchMap.get(Number(branchId)) ?? 0;
                    if (avail < reqQty) {
                        return { ok: false, avail, reqQty, productName: item.products?.nameProduct || item.name || 'Sản phẩm' };
                    }
                }
            }
            return { ok: true };
        }

        async function loadCheckout() {
            if (!auth.requireAuth()) return;

            try {
                const rawSelected = sessionStorage.getItem('selectedCartItems');
                if (!rawSelected) {
                    checkoutContainer.innerHTML = `
                        <div class="card" style="text-align: center; padding: 64px 24px;">
                            <h3 style="font-size: var(--text-lg); margin-bottom: 8px;">Chưa có sản phẩm nào được chọn</h3>
                            <p style="font-size: var(--text-xs); margin-bottom: 20px;">Vui lòng chọn sản phẩm từ giỏ hàng để tiến hành thanh toán.</p>
                            <a href="cart.html" class="btn btn-primary btn-sm">Quay lại giỏ hàng</a>
                        </div>
                    `;
                    return;
                }

                selectedItems = JSON.parse(rawSelected) || [];

                const [addrRes, branchRes, ...invResults] = await Promise.all([
                    api.get(CONFIG.ENDPOINTS.AUTH.USER_ADDRESS_MY).catch(() => []),
                    api.get(CONFIG.ENDPOINTS.BRANCHES.LIST).catch(() => []),
                    ...selectedItems.map(item => {
                        const pId = item.products?.id || item.id;
                        return api.get(CONFIG.ENDPOINTS.INVENTORY.USER_DETAIL(pId)).catch(() => null);
                    })
                ]);

                addresses = Array.isArray(addrRes) ? addrRes : [];
                if (Array.isArray(branchRes) && branchRes.length > 0) {
                    branches = branchRes;
                }

                selectedItems.forEach((item, idx) => {
                    const pId = Number(item.products?.id || item.id);
                    const inv = invResults[idx];
                    const bMap = new Map();
                    if (Array.isArray(inv?.branches)) {
                        inv.branches.forEach(b => bMap.set(Number(b.branchId), Math.max(0, b.soluong || 0)));
                    }
                    productBranchStocksMap.set(pId, bMap);
                });

                const user = auth.getUser();
                if (addresses.length > 0) {
                    const def = addresses.find(a => a.defaultaddress === true || a.defaultaddress === 'true');
                    const picked = def || addresses[0];
                    selectedAddressId = picked.id;
                    receiverName = picked.username || user?.accountname || '';
                    receiverPhone = picked.phone || '';
                } else {
                    receiverName = user?.accountname || '';
                }

                // Check if customer pre-selected a store pickup branch from detail page or header location
                const loc = CONFIG.getSelectedLocation();
                const rawPreset = sessionStorage.getItem('hk_checkout_pickup_branch');
                if (rawPreset) {
                    try {
                        const preset = JSON.parse(rawPreset);
                        sessionStorage.removeItem('hk_checkout_pickup_branch');
                        if (preset.pickupBranchId) {
                            fulfillmentType = 'STORE_PICKUP';
                            selectedPickupBranchId = Number(preset.pickupBranchId);
                            const found = branches.find(b => Number(b.id) === selectedPickupBranchId);
                            if (found) selectedPickupCity = found.city || '';
                        }
                    } catch (_) {}
                } else if (loc.branchId) {
                    selectedPickupBranchId = Number(loc.branchId);
                    selectedPickupCity = loc.city || '';
                }

                if (!selectedPickupBranchId && branches.length > 0) {
                    const firstAvailable = branches.find(b => checkBranchCanFulfillAll(b.id).ok) || branches[0];
                    selectedPickupBranchId = Number(firstAvailable.id);
                }

                renderCheckout();
            } catch (err) {
                checkoutContainer.innerHTML = `
                    <div class="card" style="text-align: center; padding: 48px;">
                        <p class="text-danger">${err.message || 'Không thể tải thông tin thanh toán.'}</p>
                    </div>
                `;
            }
        }

        function renderCheckout() {
            if (!selectedItems.length) return;

            const totalAmount = selectedItems.reduce((sum, item) => {
                const price = item.products?.price || item.price || 0;
                const qty = item.quality || item.quantity || 1;
                return sum + price * qty;
            }, 0);

            const cities = [...new Set(branches.map(b => b.city).filter(Boolean))];
            const visibleBranches = selectedPickupCity
                ? branches.filter(b => b.city === selectedPickupCity)
                : branches;

            const homeDeliveryHtml = addresses.length === 0 ? `
                <div class="card" style="background: var(--surface-subtle); text-align: center; padding: 20px;">
                    <p style="font-size: var(--text-xs); margin-bottom: 12px;">Bạn chưa thiết lập địa chỉ giao tận nơi (hoặc có thể chọn tab <b>Nhận tại cửa hàng</b> bên cạnh).</p>
                    <a href="profile.html" class="btn btn-primary btn-sm">+ Thêm địa chỉ nhận hàng</a>
                </div>
            ` : `
                <div class="address-list">
                    ${addresses.map(addr => {
                        const isSel = addr.id === selectedAddressId;
                        const isDef = addr.defaultaddress === true || addr.defaultaddress === 'true';
                        return `
                            <div class="address-option ${isSel ? 'selected' : ''}" data-addr-id="${addr.id}">
                                <input type="radio" name="shippingAddr" value="${addr.id}" ${isSel ? 'checked' : ''} style="margin-top: 4px; accent-color: var(--brand-green);" />
                                <div style="flex: 1;">
                                    <div style="display: flex; align-items: center; gap: 8px; font-weight: var(--font-semibold); font-size: var(--text-sm);">
                                        <span>${addr.username}</span>
                                        <span class="tabular-nums" style="color: var(--text-secondary); font-weight: normal;">(${addr.phone})</span>
                                        ${isDef ? '<span class="badge badge-info">Mặc định</span>' : ''}
                                    </div>
                                    <div style="font-size: var(--text-xs); color: var(--text-secondary); margin-top: 4px;">
                                        ${addr.address}
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
                <a href="profile.html" class="btn btn-outline btn-sm">+ Quản lý sổ địa chỉ</a>
            `;

            const storePickupHtml = `
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;">
                    <div class="form-group" style="margin: 0;">
                        <label class="form-label" for="pickupReceiverName">Họ và tên người đến nhận</label>
                        <input type="text" id="pickupReceiverName" class="input" value="${(receiverName || '').replace(/"/g, '&quot;')}" required />
                    </div>
                    <div class="form-group" style="margin: 0;">
                        <label class="form-label" for="pickupReceiverPhone">Số điện thoại liên hệ</label>
                        <input type="tel" id="pickupReceiverPhone" class="input tabular-nums" value="${(receiverPhone || '').replace(/"/g, '&quot;')}" required />
                    </div>
                </div>

                <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom: 10px;">
                    <span class="form-label" style="margin:0;">Chọn cơ sở cửa hàng đến nhận máy:</span>
                    <div style="display:flex; gap:6px; flex-wrap:wrap;">
                        <button type="button" class="loc-city-tab ${selectedPickupCity === '' ? 'active' : ''}" data-pickup-city="">Tất cả (${branches.length})</button>
                        ${cities.map(c => `<button type="button" class="loc-city-tab ${selectedPickupCity === c ? 'active' : ''}" data-pickup-city="${c}">${c}</button>`).join('')}
                    </div>
                </div>

                <div class="pickup-branch-list">
                    ${visibleBranches.map(b => {
                        const check = checkBranchCanFulfillAll(b.id);
                        const isSel = Number(b.id) === Number(selectedPickupBranchId);
                        return `
                            <div class="pickup-branch-option ${isSel ? 'selected' : ''} ${check.ok ? '' : 'disabled'}" data-pickup-branch-id="${b.id}" data-branch-ok="${check.ok ? '1' : '0'}">
                                <input type="radio" name="pickupBranchRadio" value="${b.id}" ${isSel ? 'checked' : ''} ${check.ok ? '' : 'disabled'} style="margin-top: 4px; accent-color: var(--brand-green);" />
                                <div style="flex: 1; min-width: 0;">
                                    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;">
                                        <span style="font-weight: 700; font-size: var(--text-sm); color: var(--text-primary);">${b.name} (${b.city})</span>
                                        <span class="badge ${check.ok ? 'badge-success' : 'badge-danger'}">
                                            ${check.ok ? 'Sẵn đủ hàng tại cơ sở' : `Tạm thiếu: ${check.productName}`}
                                        </span>
                                    </div>
                                    <div style="font-size: var(--text-xs); color: var(--text-secondary); margin-top: 3px;">${b.address}</div>
                                    <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;" class="tabular-nums">
                                        Giờ mở cửa: ${b.openingHours || b.hours || '8:00 - 21:00'} · ĐT: ${b.phone || CONFIG.HOTLINE}
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;

            checkoutContainer.innerHTML = `
                <div class="checkout-grid">
                    <div class="card">
                        <h3 style="font-size: var(--text-lg); margin-bottom: 12px;">1. Hình thức nhận hàng</h3>
                        <div class="fulfillment-tabs">
                            <button type="button" class="fulfillment-tab ${fulfillmentType === 'HOME_DELIVERY' ? 'active' : ''}" data-fulfillment="HOME_DELIVERY">
                                <input type="radio" name="fulfillmentMode" ${fulfillmentType === 'HOME_DELIVERY' ? 'checked' : ''} style="accent-color: var(--brand-green);" />
                                <div>
                                    <div class="fulfillment-tab-title">Giao hàng tận nơi</div>
                                    <div class="fulfillment-tab-sub">Xuất kho từ cơ sở gần bạn nhất</div>
                                </div>
                            </button>
                            <button type="button" class="fulfillment-tab ${fulfillmentType === 'STORE_PICKUP' ? 'active' : ''}" data-fulfillment="STORE_PICKUP">
                                <input type="radio" name="fulfillmentMode" ${fulfillmentType === 'STORE_PICKUP' ? 'checked' : ''} style="accent-color: var(--brand-green);" />
                                <div>
                                    <div class="fulfillment-tab-title">Nhận tại cửa hàng</div>
                                    <div class="fulfillment-tab-sub">Giữ hàng tại cơ sở để bạn đến lấy</div>
                                </div>
                            </button>
                        </div>

                        ${fulfillmentType === 'STORE_PICKUP' ? storePickupHtml : homeDeliveryHtml}

                        <h3 style="font-size: var(--text-lg); margin: 28px 0 12px;">2. Phương thức thanh toán</h3>
                        <div class="payment-methods">
                            <div class="payment-method-card ${selectedPaymentMethod === 'SEPAY' ? 'selected' : ''}" data-method="SEPAY">
                                <div class="payment-method-title">Chuyển khoản ngân hàng (Quét mã VietQR)</div>
                                <div class="payment-method-desc">Quét mã QR bằng ứng dụng ngân hàng, tự động xác nhận đơn hàng.</div>
                            </div>
                            <div class="payment-method-card ${selectedPaymentMethod === 'VNPAY' ? 'selected' : ''}" data-method="VNPAY">
                                <div class="payment-method-title">Thẻ ATM / Ngân hàng nội địa (VNPay)</div>
                                <div class="payment-method-desc">Thanh toán trực tuyến qua cổng thẻ ATM nội địa hoặc ứng dụng VNPay.</div>
                            </div>
                            <div class="payment-method-card ${selectedPaymentMethod === 'LATER' ? 'selected' : ''}" data-method="LATER">
                                <div class="payment-method-title">Đặt giữ hàng (Thanh toán sau)</div>
                                <div class="payment-method-desc">Giữ sản phẩm tại kho cơ sở và thanh toán trong mục Đơn hàng của tôi.</div>
                            </div>
                        </div>

                        <div class="form-group" style="margin-top: 24px;">
                            <label class="form-label" for="orderNote">Ghi chú giao hàng &amp; lắp ráp (Tùy chọn)</label>
                            <textarea id="orderNote" class="textarea" rows="2"></textarea>
                        </div>

                        <button type="button" id="btnPlaceOrder" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 12px;">
                            Xác nhận đặt hàng (${formatPrice(totalAmount)})
                        </button>
                    </div>

                    <div class="card" style="height: fit-content;">
                        <h3 style="font-size: var(--text-lg); margin-bottom: 16px;">Tóm tắt sản phẩm (${selectedItems.length})</h3>
                        <div>
                            ${selectedItems.map(item => {
                                const prod = item.products || item;
                                const name = prod.nameProduct || prod.name || 'Sản phẩm';
                                const price = prod.price || 0;
                                const qty = item.quality || item.quantity || 1;
                                const img = prod.image || 'https://images.unsplash.com/photo-1587202372775-e229f172b9d7?w=200&q=80';
                                return `
                                    <div class="summary-item">
                                        <img src="${img}" alt="${name}" />
                                        <div style="flex: 1;">
                                            <div style="font-size: var(--text-sm); font-weight: var(--font-medium);">${name}</div>
                                            <div style="font-size: var(--text-xs); color: var(--text-secondary);">Số lượng: ${qty}</div>
                                        </div>
                                        <div class="tabular-nums" style="font-size: var(--text-sm); font-weight: var(--font-semibold);">
                                            ${formatPrice(price * qty)}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        <div style="display:flex; justify-content:space-between; font-size:13px; color:var(--text-secondary); margin-top:14px;">
                            <span>Tạm tính</span>
                            <span class="tabular-nums">${formatPrice(totalAmount)}</span>
                        </div>

                        <div class="summary-total">
                            <span>Tổng thanh toán</span>
                            <span class="tabular-nums" style="color: #D0021C;">${formatPrice(totalAmount)}</span>
                        </div>
                        <p style="font-size: var(--text-xs); color: var(--text-secondary); margin-top: 12px;">
                            Phiếu bảo hành điện tử (12 - 36 tháng) sẽ tự động kích hoạt theo tài khoản của bạn ngay sau khi hoàn tất thanh toán.
                        </p>
                    </div>
                </div>
            `;

            document.querySelectorAll('[data-fulfillment]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const nameEl = document.getElementById('pickupReceiverName');
                    const phoneEl = document.getElementById('pickupReceiverPhone');
                    if (nameEl) receiverName = nameEl.value.trim();
                    if (phoneEl) receiverPhone = phoneEl.value.trim();
                    fulfillmentType = btn.dataset.fulfillment;
                    renderCheckout();
                });
            });

            document.querySelectorAll('[data-pickup-city]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const nameEl = document.getElementById('pickupReceiverName');
                    const phoneEl = document.getElementById('pickupReceiverPhone');
                    if (nameEl) receiverName = nameEl.value.trim();
                    if (phoneEl) receiverPhone = phoneEl.value.trim();
                    selectedPickupCity = btn.dataset.pickupCity || '';
                    renderCheckout();
                });
            });

            document.querySelectorAll('.pickup-branch-option').forEach(el => {
                el.addEventListener('click', () => {
                    if (el.dataset.branchOk !== '1') {
                        toast.warning('Cơ sở này hiện không đủ số lượng cho toàn bộ sản phẩm trong giỏ. Vui lòng chọn cơ sở khác hoặc chọn Giao tận nơi.');
                        return;
                    }
                    const nameEl = document.getElementById('pickupReceiverName');
                    const phoneEl = document.getElementById('pickupReceiverPhone');
                    if (nameEl) receiverName = nameEl.value.trim();
                    if (phoneEl) receiverPhone = phoneEl.value.trim();
                    selectedPickupBranchId = Number(el.dataset.pickupBranchId);
                    renderCheckout();
                });
            });

            document.querySelectorAll('.address-option').forEach(el => {
                el.addEventListener('click', () => {
                    selectedAddressId = Number(el.dataset.addrId);
                    renderCheckout();
                });
            });

            document.querySelectorAll('.payment-method-card').forEach(el => {
                el.addEventListener('click', () => {
                    selectedPaymentMethod = el.dataset.method;
                    renderCheckout();
                });
            });

            document.getElementById('btnPlaceOrder')?.addEventListener('click', handlePlaceOrder);
        }

        async function handlePlaceOrder() {
            const isPickup = fulfillmentType === 'STORE_PICKUP';

            if (!isPickup && !selectedAddressId) {
                toast.warning('Vui lòng chọn địa chỉ giao hàng (hoặc chuyển sang tab Nhận tại cửa hàng).');
                return;
            }

            if (isPickup) {
                const nameVal = document.getElementById('pickupReceiverName')?.value.trim() || '';
                const phoneVal = document.getElementById('pickupReceiverPhone')?.value.trim() || '';
                if (!nameVal || !phoneVal) {
                    toast.warning('Vui lòng nhập Họ tên và Số điện thoại người đến nhận hàng.');
                    return;
                }
                if (!selectedPickupBranchId) {
                    toast.warning('Vui lòng chọn cơ sở cửa hàng để đến nhận máy.');
                    return;
                }
                const check = checkBranchCanFulfillAll(selectedPickupBranchId);
                if (!check.ok) {
                    toast.error(`Cơ sở bạn chọn hiện không đủ số lượng cho sản phẩm "${check.productName}". Vui lòng chọn cơ sở khác.`);
                    return;
                }
                receiverName = nameVal;
                receiverPhone = phoneVal;
            }

            const btn = document.getElementById('btnPlaceOrder');
            btn.disabled = true;
            btn.textContent = 'Đang khởi tạo đơn hàng & giữ kho...';

            try {
                const loc = CONFIG.getSelectedLocation();
                const orderItems = selectedItems.map(item => ({
                    productId: item.products?.id || item.id,
                    quantity: item.quality || item.quantity || 1
                }));

                await api.post(CONFIG.ENDPOINTS.ORDERS.CREATE, {
                    AddressesId: selectedAddressId,
                    fulfillmentType: isPickup ? 'STORE_PICKUP' : 'HOME_DELIVERY',
                    pickupBranchId: isPickup ? selectedPickupBranchId : null,
                    preferredBranchId: !isPickup ? (loc.branchId || null) : null,
                    preferredCity: !isPickup ? (loc.city || null) : null,
                    receiverName: receiverName || null,
                    receiverPhone: receiverPhone || null,
                    orderItems
                });

                for (const item of selectedItems) {
                    if (item.id && !isNaN(item.id)) {
                        try {
                            await api.delete(CONFIG.ENDPOINTS.CART.REMOVE(item.id));
                        } catch (_) {}
                    }
                }

                sessionStorage.removeItem('selectedCartItems');
                await cart.getCart();

                toast.success('Đặt hàng thành công! Đang chuyển tới trang đơn hàng & thanh toán...');
                setTimeout(() => {
                    window.location.href = `order.html?payMethod=${selectedPaymentMethod}`;
                }, 900);
            } catch (err) {
                toast.error(err.message || 'Không thể tạo đơn hàng.');
                btn.disabled = false;
                btn.textContent = 'Xác nhận đặt hàng';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initStoreLayout({ activeNav: '' });
            cart.updateHeaderBadge();
            loadCheckout();
        });
    </script>
</body>
</html>
